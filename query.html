<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>MISSION CONTROL · LGNS 资产遥测</title>
<meta name="theme-color" content="#0a1015">
<link rel="icon" href="./icons/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="manifest" href="./icons/manifest.webmanifest">
<meta name="theme-color" content="#0a1015">

<meta name="description" content="双链 LGNS 总币量查询 · 深空遥测风格 UI">
<style>
/* ============================================================
   BASE — 所有主题共用的结构与排版骨架
   只负责布局/层级/节奏，颜色、边框、光效全部交给主题
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
body{
  min-height:100vh;
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  letter-spacing:.004em;
  color:var(--tx);
}
:root{
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --r:20px;--r-sm:12px;--r-pill:999px;
}
::selection{background:var(--sel,rgba(10,132,255,.28));color:var(--sel-tx,inherit)}
a{color:inherit}
button{font:inherit;cursor:pointer}
.shell{position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:clamp(24px,4.5vw,52px) clamp(14px,3vw,26px) 72px}

/* ---------- 顶部 ---------- */
.masthead{position:relative;margin:0 0 16px}
.eyebrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;
  font:600 10px/1 var(--mono);letter-spacing:.28em;text-transform:uppercase;color:var(--dim)}
.eyebrow .barline{flex:1 1 40px;height:1px;background:var(--line);min-width:24px}
.eyebrow .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:0 0 auto}
h1{margin:0 0 10px;font-size:clamp(28px,4.8vw,44px);line-height:1.08;letter-spacing:-.03em;font-weight:750}
h1 em{font-style:normal}
.sub{margin:0;max-width:62ch;font-size:12.5px;line-height:1.7;color:var(--tx-2)}
.sub b{color:var(--tx);font-weight:650}
.topbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 0}
.topbar .sub{flex:1 1 320px}
.status{font:500 11px/1.5 var(--mono);color:var(--dim);text-align:right;margin-left:auto;letter-spacing:.01em}
.status.live{color:var(--tx-2)}
.status.err{color:var(--warn)}
.spin{display:inline-block;width:11px;height:11px;margin-right:8px;vertical-align:-1px;
  border:2px solid var(--line-2);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 输入区 ---------- */
.qcard{position:relative;margin-top:16px;padding:14px}
.q{display:block;width:100%;min-height:86px;resize:vertical;padding:14px 15px;
  color:var(--tx);background:var(--field);border:1px solid var(--line);border-radius:var(--r-sm);
  font:13px/1.7 var(--mono);letter-spacing:.15px;outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s}
.q::placeholder{color:var(--dim);opacity:.85}
.q:focus{border-color:var(--acc);box-shadow:var(--focus)}
.qrow{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:stretch}

.btn{position:relative;isolation:isolate;overflow:hidden;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;
  flex:1 1 auto;min-height:50px;padding:13px 26px;border:1px solid var(--btn-brd);
  border-radius:var(--btn-r);background:var(--btn-bg);color:var(--btn-tx);
  font:650 14px/1 var(--font-ui,-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif);
  letter-spacing:.04em;transition:transform .18s,box-shadow .2s,filter .2s,background .2s,color .2s}
.btn .lg-edge{position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  box-shadow:var(--btn-edge,none)}
.btn .lg-label{position:relative;z-index:2;display:inline-flex;align-items:center;gap:8px}
.btn:hover:not(:disabled){transform:translateY(-1px);filter:brightness(1.06);box-shadow:var(--btn-hover)}
.btn:active:not(:disabled){transform:translateY(0) scale(.99)}
.btn:disabled{opacity:.5;cursor:default;filter:saturate(.4)}
.btn.ghost{flex:0 0 auto;background:var(--ghost-bg);color:var(--tx-2);border-color:var(--line-2);box-shadow:none}
.btn.ghost:hover:not(:disabled){color:var(--tx);border-color:var(--acc)}
.btn:focus-visible,.wallet-head:focus-visible{outline:2px solid var(--acc);outline-offset:3px}

/* ---------- 汇总 HERO ---------- */
.hero{position:relative;margin-top:20px;padding:clamp(18px,3vw,26px);
  display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,.85fr);
  gap:16px 22px;align-items:end}
.hero .k{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font:500 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.hero .k i{font-style:normal;font-size:10px;letter-spacing:.08em;padding:4px 9px;border-radius:var(--r-pill);
  background:var(--chip);border:1px solid var(--chip-brd);color:var(--acc-2)}
.hero .k i.n{background:transparent;border-color:var(--line);color:var(--dim)}
.hero .v{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:12px 0 8px;
  font:750 clamp(34px,6.4vw,54px)/.98 var(--mono);letter-spacing:-.045em;
  color:var(--hero-num);font-variant-numeric:tabular-nums;text-shadow:var(--hero-glow)}
.hero .v small{font:600 12px/1 var(--mono);letter-spacing:.22em;color:var(--dim);text-shadow:none}
.hero .eq{font-size:11.5px;line-height:1.75;color:var(--dim);max-width:68ch;word-break:break-word}
.hero-side{display:grid;gap:8px;align-self:stretch;align-content:end}
.mini{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:11px 14px}
.mini span{font-size:11px;color:var(--dim);letter-spacing:.02em}
.mini b{font:650 14px/1 var(--mono);color:var(--tx);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.mini.mute b{color:var(--tx-2);font-weight:500}
.split{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.bar{padding:11px 14px}
.bar .t{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;
  font:500 10.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.bar .t b{font-size:12px;letter-spacing:0;text-transform:none;color:var(--tx-2);font-variant-numeric:tabular-nums}
.bar .track{height:5px;border-radius:99px;overflow:hidden;background:var(--track)}
.bar .fill{height:100%;border-radius:99px;background:var(--fill);transition:width .9s cubic-bezier(.2,.8,.3,1);
  box-shadow:var(--fill-glow,none)}

/* ---------- 钱包 ---------- */
.nb{white-space:nowrap}
.wallet{margin-top:18px}
.wbody{display:none}
.wallet.open .wbody{display:block}
.wallet-head{cursor:pointer;user-select:none;
  display:grid;grid-template-columns:16px minmax(0,1fr) minmax(0,3fr);align-items:center;gap:14px;
  padding:12px 16px;transition:background .2s,border-color .2s,box-shadow .2s}
.chev{width:7px;height:7px;justify-self:center;margin-bottom:2px;
  border-right:1.6px solid var(--dim);border-bottom:1.6px solid var(--dim);
  transform:rotate(-45deg);transition:transform .24s cubic-bezier(.2,.8,.3,1),border-color .2s}
.wallet.open .chev{transform:rotate(45deg);border-color:var(--acc)}
.wleft{display:flex;align-items:center;gap:10px;min-width:0}
.idx{flex:0 0 auto;padding:4px 8px;border-radius:var(--r-pill);
  font:600 10px/1 var(--mono);letter-spacing:.06em;color:var(--dim);
  border:1px solid var(--line-2);background:var(--chip)}
.waddr{font:600 14px/1.2 var(--mono);letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* 三列等宽轨道 + 地址占等宽首列：四块内容按同一节奏平均分布 */
.wallet-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));
  align-items:baseline;justify-items:start;column-gap:clamp(8px,1.4vw,18px);width:100%}
.wallet-sum .stat{display:flex;align-items:baseline;gap:9px;min-width:0;white-space:nowrap}
.wallet-sum em{flex:0 0 auto;font-style:normal;font:600 8.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.wallet-sum b{font:600 14px/1 var(--mono);color:var(--tx-2);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.wallet-sum .total b{font-weight:750;color:var(--tx);font-size:14px}
.grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:10px}
@media(min-width:920px){.grid{grid-template-columns:1fr 1fr}}

/* ---------- 链卡 ---------- */
.card{position:relative;padding:18px;display:flex;flex-direction:column}
.ch{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"pill tot" "parts parts";
  gap:9px 12px;align-items:start;margin-bottom:12px}
.pill{grid-area:pill;justify-self:start;align-self:center;padding:5px 9px;border-radius:var(--r-pill);
  font:650 9.5px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;border:1px solid var(--line-2);color:var(--dim)}
.pill.poly{color:var(--poly);border-color:var(--poly-brd);background:var(--poly-bg)}
.pill.anb{color:var(--anb);border-color:var(--anb-brd);background:var(--anb-bg)}
.ch .tot{grid-area:tot;justify-self:end;text-align:right;line-height:1.25}
.ch .tot>span{display:block;font:500 9.5px/1.4 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.ch .tot b{font:750 18px/1.25 var(--mono);color:var(--tx);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.ch .parts{grid-area:parts;display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-width:0}
.ch .parts i{display:inline-block;font-style:normal;font:500 9.5px/1.5 var(--mono);letter-spacing:.02em;color:var(--dim);
  border:1px solid var(--line);border-radius:var(--r-pill);padding:2px 8px;background:var(--chip)}

/* ---------- 小节 / 行 ---------- */
.sec{margin-top:12px;padding:2px 12px 4px}
.sec-h{display:flex;align-items:center;gap:8px;padding:11px 0 3px;
  font:650 9.5px/1.4 var(--mono);letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}
.sec-h .hint{margin-left:auto;font:600 8.5px/1 var(--mono);letter-spacing:.08em;text-transform:none;
  padding:4px 7px;border-radius:var(--r-pill);background:var(--ok-bg);color:var(--ok)}
.sec-h .hint.off{background:var(--warn-bg);color:var(--warn)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:14px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .l{font-size:12.8px;color:var(--tx-2);min-width:0}
.row .l small{display:block;margin-top:2px;font-size:10.5px;line-height:1.5;color:var(--dim)}
.row .r{display:inline-flex;align-items:baseline;justify-content:flex-end;gap:0;
  font:600 13px/1.4 var(--mono);color:var(--tx);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
/* 单位固定槽：单位宽度不同（LGNS / USDT / 笔…）时数字仍然落在同一条右对齐线 */
.row .r em{font-style:normal;flex:0 0 auto;min-width:3.5em;margin-left:.45em;text-align:left;
  font:500 9.5px/1 var(--mono);letter-spacing:.06em;color:var(--dim)}
.row.sum .l{font-weight:650;color:var(--tx)}
.row.sum .r{color:var(--acc-2);font-weight:750;font-size:14px}
.row.zero .l,.row.zero .r{color:var(--faint)}

/* ---------- 折叠面板 ---------- */
details{margin-top:8px}
details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;
  padding:9px 12px;font-size:12px;font-weight:550;color:var(--tx-2);
  transition:background .18s,color .18s;min-height:36px}
details>summary:hover{color:var(--tx)}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"";flex:0 0 auto;width:5px;height:5px;margin:0 3px 1px 0;
  border-right:1.5px solid var(--dim);border-bottom:1.5px solid var(--dim);
  transform:rotate(-45deg);transition:transform .24s,border-color .2s}
details[open]>summary::before{transform:rotate(45deg);border-color:var(--acc)}
details>summary .m{margin-left:auto;flex:0 0 auto;white-space:nowrap;font:500 10.5px/1.3 var(--mono);color:var(--dim);font-variant-numeric:tabular-nums;text-align:right}
.dbody{padding:2px 12px 10px}
.lock{padding:10px 0;border-top:1px solid var(--line)}
.lock:first-child{border-top:0;padding-top:2px}
.lock-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px;font-size:12px;color:var(--tx-2)}
.lock-h>span:first-child{min-width:0}
.lock-h .m{flex:0 0 auto;font:500 10.5px/1.4 var(--mono);color:var(--dim);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.ent{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;column-gap:12px;
  padding:5px 0;font-size:11px;color:var(--dim);line-height:1.55}
.ent b{font-family:var(--mono);font-weight:600;color:var(--tx-2);font-variant-numeric:tabular-nums}
/* 右侧读数栏：标签成列 + 数字定宽右对齐 → 每行的“应付/可领”与数值都落在同一条竖线上 */
.ent .rr{display:inline-flex;align-items:baseline;justify-content:flex-end;gap:8px;
  text-align:right;white-space:nowrap;color:var(--dim)}
.ent .rr i{font-style:normal;flex:0 0 auto}
.ent .rr b{flex:0 0 auto;min-width:7.8em;text-align:right;color:var(--tx-2)}
.ent .when{color:var(--faint)}
.ent.muted{color:var(--faint)}
.ent-sub{opacity:.92}
.errbox{margin-top:10px;padding:9px 11px;border-radius:var(--r-sm);font-size:10.5px;line-height:1.7;
  color:var(--warn);background:var(--warn-bg);border:1px solid var(--warn-brd)}

/* ---------- 骨架屏 / 空状态 / 页脚 ---------- */
.skel{display:grid;gap:12px;margin-top:18px}
.sk-card{padding:18px;min-height:120px}
.sk-line{height:11px;border-radius:4px;margin-bottom:10px;background:var(--sk);
  background-size:220% 100%;animation:sk 1.4s ease-in-out infinite}
.sk-line:last-child{margin-bottom:0}
.sk-big{height:26px;width:46%;margin-bottom:16px}
.w30{width:30%}.w50{width:50%}.w70{width:70%}.w90{width:90%}
@keyframes sk{0%{background-position:120% 0}100%{background-position:-120% 0}}
.fade{animation:fade .45s cubic-bezier(.2,.8,.3,1) both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.empty{margin-top:20px;padding:44px 20px;text-align:center;font-size:12px;line-height:1.9;color:var(--dim)}
.foot{margin-top:28px;font-size:10px;line-height:1.9;color:var(--faint);text-align:center;letter-spacing:.01em;overflow-wrap:anywhere}

/* ---------- 响应式 ---------- */
@media(max-width:820px){
  .hero{grid-template-columns:1fr;align-items:start}
  .split{grid-template-columns:1fr}
  .wallet-head{grid-template-columns:16px minmax(0,1fr);row-gap:11px;padding:13px 14px}
  .wallet-sum{grid-column:1/-1;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .wallet-sum .stat{flex-direction:column;align-items:flex-start;gap:3px;min-width:0}
  .wallet-sum b,.wallet-sum .total b{font-size:12px}
  .ch{grid-template-columns:1fr;grid-template-areas:"pill" "tot" "parts";row-gap:7px}
  .ch .tot{justify-self:start;text-align:left}
  .status{text-align:left;margin-left:0;white-space:normal}
  .row .r{font-size:12px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  html{scroll-behavior:auto}
}

/* ============================================================
   THEME 04 · MISSION CONTROL — 深空遥测 / 琥珀 × 青
   ============================================================ */
:root{
  --tx:#e6f2f4;--tx-2:#a9c2c6;--dim:#6b8489;--faint:#40565b;
  --acc:#ffb347;--acc-2:#4fe3cf;--ok:#4fe3cf;--warn:#ff6b6b;
  --line:rgba(140,190,200,.15);--line-2:rgba(255,179,71,.32);
  --field:rgba(4,9,12,.62);--chip:rgba(255,179,71,.06);
  --track:rgba(140,190,200,.12);
  --fill:linear-gradient(90deg,#ffb347,#ff8a3d 52%,#ff5f6d);
  --fill-glow:0 0 14px rgba(255,179,71,.55);
  --focus:0 0 0 1px rgba(255,179,71,.5),0 0 24px -8px rgba(255,179,71,.55);
  --btn-r:2px;
  --poly:#ffc46b;--poly-brd:rgba(255,196,107,.38);--poly-bg:rgba(255,196,107,.07);
  --anb:#4fe3cf;--anb-brd:rgba(79,227,207,.38);--anb-bg:rgba(79,227,207,.07);
  --ok-bg:rgba(79,227,207,.1);--warn-bg:rgba(255,107,107,.08);--warn-brd:rgba(255,107,107,.35);
  --sk:linear-gradient(90deg,rgba(140,190,200,.04),rgba(140,190,200,.16),rgba(140,190,200,.04));
  --hero-num:#f4fbfc;--hero-glow:0 0 30px rgba(79,227,207,.25);
  --btn-bg:linear-gradient(180deg,#ffc46b,#ffa02e);
  --btn-brd:rgba(255,220,160,.75);--btn-tx:#1a1205;
  --btn-hover:0 10px 30px -10px rgba(255,160,46,.75);
  --ghost-bg:rgba(79,227,207,.03);
  --sel:rgba(255,179,71,.3);
  --font-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}

body{
  background:
    radial-gradient(1000px 620px at 12% -12%,rgba(255,179,71,.11),transparent 62%),
    radial-gradient(900px 700px at 92% 4%,rgba(79,227,207,.09),transparent 64%),
    radial-gradient(900px 700px at 50% 118%,rgba(79,227,207,.06),transparent 60%),
    linear-gradient(180deg,#05090c,#04070a 60%,#030507);
  background-attachment:fixed;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(140,190,200,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(140,190,200,.05) 1px,transparent 1px);
  background-size:88px 88px;
  -webkit-mask-image:radial-gradient(ellipse 90% 70% at 50% 20%,#000 10%,transparent 82%);
  mask-image:radial-gradient(ellipse 90% 70% at 50% 20%,#000 10%,transparent 82%);
}
body::after{
  content:"";position:fixed;left:0;right:0;top:0;height:1px;z-index:1;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(79,227,207,.65),rgba(255,179,71,.5),transparent);
  box-shadow:0 0 18px rgba(79,227,207,.55);
  animation:scan-rail 11s linear infinite;
}
@keyframes scan-rail{0%{transform:translateY(0)}100%{transform:translateY(100vh)}}

/* ---------- 状态条 ---------- */
.hud-rail{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:0 2px 9px;margin-bottom:16px;border-bottom:1px solid var(--line);
  font:600 9px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--faint);
}
.hud-rail .ok{color:var(--acc-2);display:inline-flex;align-items:center;gap:6px}
.hud-rail .ok::before{content:"";width:5px;height:5px;border-radius:50%;background:var(--acc-2);
  box-shadow:0 0 8px var(--acc-2);animation:pulse-dot 2.6s ease-in-out infinite}
@keyframes pulse-dot{50%{opacity:.3;box-shadow:0 0 2px var(--acc-2)}}
.hud-rail .ticks{flex:1 1 80px;height:6px;min-width:40px;opacity:.5;
  background:repeating-linear-gradient(90deg,var(--dim) 0 1px,transparent 1px 7px);
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}

/* ---------- 头部 ---------- */
.masthead{display:grid;grid-template-columns:minmax(0,1fr) 148px;gap:26px;align-items:center}
.eyebrow{color:var(--dim);justify-content:flex-start}
.eyebrow .barline{flex:0 0 42px}
.eyebrow .barline{background:linear-gradient(90deg,var(--acc),transparent)}
h1{font-weight:750;letter-spacing:-.032em;margin-bottom:12px}
h1 em{background:linear-gradient(94deg,#ffd79a,#ffb347 42%,#ff7a59 72%,#4fe3cf);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(255,179,71,.28))}
.sub{color:var(--tx-2);max-width:58ch}
.topbar{margin-top:14px;justify-content:flex-start}
.topbar .status{margin-left:0}
.status{color:var(--dim);font-family:var(--mono)}
.status::before{content:"SYS/ ";color:var(--faint)}
.status.live{color:var(--acc-2)}
.status.err{color:var(--warn)}
.status.err::before{content:"ERR/ ";color:var(--warn)}

.hud-dial{
  position:relative;width:148px;aspect-ratio:1;border-radius:50%;
  border:1px solid rgba(255,179,71,.22);
  background:
    radial-gradient(circle,rgba(9,17,22,1) 0 54%,rgba(9,17,22,0) 55%),
    repeating-conic-gradient(from -90deg,rgba(255,179,71,.5) 0deg .7deg,transparent .7deg 9deg),
    radial-gradient(circle at 50% 50%,rgba(79,227,207,.10),transparent 68%);
  animation:spin 40s linear infinite;
}
.hud-dial::before{
  content:"";position:absolute;inset:16px;border:1px dashed rgba(79,227,207,.35);border-radius:50%;
  animation:spin 26s linear infinite reverse;
}
.hud-dial::after{
  content:"";position:absolute;inset:44%;border-radius:50%;border:1px solid rgba(79,227,207,.5);
  box-shadow:0 0 18px rgba(79,227,207,.5);
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 通用面板 ---------- */
.qcard,.hero,.card,.wallet-head,.mini,.bar,.sec,details,.empty,.sk-card{
  background:linear-gradient(160deg,rgba(13,22,28,.9),rgba(5,10,14,.94));
  border:1px solid var(--line);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 24px 60px -40px #000;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
}
.qcard{border-radius:4px;padding:16px;position:relative}
.qcard::before,.hero::before,.card::before,.wallet-head::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.035),transparent 24%);
}
.qcard,.hero,.card,.wallet-head{isolation:isolate}
.qcard>*,.hero>*,.card>*,.wallet-head>*{position:relative;z-index:1}
.qhead{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;
  font:600 9px/1 var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}
.qtag{color:var(--acc)}
.qmeta{color:var(--faint)}

.q{
  border-radius:3px;border:1px solid rgba(140,190,200,.16);background:rgba(3,7,10,.7);
  box-shadow:inset 0 0 30px -18px rgba(79,227,207,.5);caret-color:var(--acc);
}
.btn{
  border-radius:2px;text-transform:uppercase;letter-spacing:.12em;font:700 12.5px/1 var(--mono);
  clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%);
  box-shadow:0 0 30px -14px rgba(255,179,71,.8);
}
.btn.ghost{color:var(--acc-2);border-color:rgba(79,227,207,.28);box-shadow:none;clip-path:none}
.btn.ghost:hover:not(:disabled){background:rgba(79,227,207,.07);border-color:var(--acc-2)}
.btn:disabled{opacity:.4}
.btn .lg-edge{display:none}

/* ---------- HERO ---------- */
.hero{border-radius:4px;padding:22px 24px;position:relative;overflow:hidden}
.hero::after{
  content:"";position:absolute;left:0;right:0;top:0;height:2px;pointer-events:none;
  background:linear-gradient(90deg,var(--acc),rgba(255,179,71,.1) 32%,transparent 60%,rgba(79,227,207,.5));
}
.hero .k{color:var(--dim)}
.hero .k i{border-radius:2px;background:var(--chip);border-color:rgba(255,179,71,.22);color:var(--acc)}
.hero .k i.n{color:var(--dim);border-color:var(--line);background:transparent}
.hero .v{color:#f7fdff;text-shadow:0 0 24px rgba(79,227,207,.22)}
.hero .v small{color:var(--acc);text-shadow:0 0 14px rgba(255,179,71,.35)}
.hero .eq{color:var(--dim);word-break:keep-all}
.mini,.bar{border-radius:3px;background:rgba(255,179,71,.03);border-color:var(--line);box-shadow:none}
.mini b{color:#fff}
.bar .t{color:var(--dim)}
.bar .t b{color:var(--tx-2)}
.bar .track{height:6px;border-radius:1px;background:var(--track);position:relative;overflow:visible}
.bar .track::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0 11px,rgba(3,7,10,.9) 11px 13px);
}
.bar .fill{border-radius:0;box-shadow:0 0 12px rgba(255,179,71,.6)}

/* ---------- 钱包 ---------- */
.wallet-head{border-radius:3px;padding:12px 16px;position:relative}
.wallet-head::after{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:repeating-linear-gradient(180deg,var(--acc) 0 4px,transparent 4px 8px);opacity:.55;
}
.wallet-head:hover{border-color:rgba(255,179,71,.35)}
.wallet.open .wallet-head{border-color:rgba(255,179,71,.42);background:linear-gradient(160deg,rgba(20,32,40,.94),rgba(7,14,19,.96))}
.idx{border-radius:2px;border-color:rgba(255,179,71,.25);color:var(--acc);background:rgba(255,179,71,.05)}
.waddr{color:#f2fbfd}
.wallet-sum em{color:var(--dim)}
.wallet-sum .total b{color:#fff;text-shadow:0 0 16px rgba(255,179,71,.35)}

/* ---------- 链卡 ---------- */
.card{border-radius:4px;padding:28px 18px 18px;position:relative;overflow:hidden}
.card::after{
  content:"CH·01";position:absolute;top:0;right:0;padding:5px 9px;
  background:var(--acc);color:#10130a;font:800 8px/1 var(--mono);letter-spacing:.18em;
}
.grid>.card:nth-child(2)::after{content:"CH·02";background:var(--acc-2);color:#04110f}
.card:hover{border-color:rgba(255,179,71,.28);box-shadow:0 30px 70px -40px #000,inset 0 1px 0 rgba(255,255,255,.05)}
.pill{border-radius:2px;padding:5px 8px;letter-spacing:.16em}
.ch .tot b{color:#f6fdff;text-shadow:0 0 16px rgba(79,227,207,.25)}
.ch .parts i{background:rgba(255,179,71,.04);border-color:rgba(140,190,200,.14)}
.sec{background:rgba(79,227,207,.02);border-color:rgba(140,190,200,.12);border-radius:3px;box-shadow:none}
.sec-h{color:var(--dim)}
.sec-h::before{content:"";width:8px;height:1px;background:var(--acc);box-shadow:0 0 8px var(--acc)}
.sec-h .hint{border-radius:2px;color:var(--acc-2);background:rgba(79,227,207,.09)}
.row .l{color:var(--tx-2)}
.row .r{color:#f3fbfd}
.row.sum .r{color:var(--acc);text-shadow:0 0 14px rgba(255,179,71,.4)}
details{background:rgba(79,227,207,.015);border-color:var(--line);border-radius:3px}
details[open]{border-color:rgba(255,179,71,.24)}
details>summary{color:var(--tx-2)}
details>summary:hover{background:rgba(255,179,71,.04);color:var(--tx)}
details[open]>summary{border-bottom:1px solid var(--line);color:var(--acc)}
details>summary .m{color:var(--dim)}
.lock-h{color:var(--tx-2)}
.ent b{color:var(--tx-2)}
.errbox{border-radius:2px}
.empty{border:1px dashed rgba(255,179,71,.28);border-radius:3px;background:rgba(255,179,71,.02)}
.empty::before{content:"[ AWAITING TELEMETRY ]";display:block;margin-bottom:8px;
  font:700 9px/1 var(--mono);letter-spacing:.3em;color:var(--acc)}
.foot{color:var(--faint)}
.foot::before{content:"◈ ";color:var(--acc-2)}

@media(max-width:860px){
  .masthead{grid-template-columns:1fr}
  .hud-dial{display:none}
}

  function hexToBig(h) {

    try { return BigInt(h); } catch (e) { return 0n; }
  }
  function words(h) {
    var s = (typeof h === 'string' ? h : '').replace(/^0x/, ''), out = [];
    for (var i = 0; i + 64 <= s.length; i += 64) out.push(BigInt('0x' + s.slice(i, i + 64)));
    return out;
  }
  function decStr(raw, dec) {
    var neg = raw < 0n, v = neg ? -raw : raw, base = 10n ** BigInt(dec);
    var ip = (v / base).toString(), fp = (v % base).toString().padStart(dec, '0').replace(/0+$/, '');
    return { neg: neg, ip: ip, fp: fp };
  }
  function group(s) { return s.replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
  function fmt(raw, dec) {
    if (raw === null || raw === undefined) return '—';
    dec = dec === undefined ? 9 : dec;
    var p = decStr(raw, dec);
    var keep = p.ip === '0' ? 6 : 2;
    var fp = (p.fp + '0000000000').slice(0, keep);
    if (/^0*$/.test(fp)) fp = '';
    return (p.neg ? '-' : '') + group(p.ip) + (fp ? '.' + fp : '');
  }
  function fmt2(raw, dec) {
    var t = fmt(raw, dec === undefined ? 9 : dec);
    return t.indexOf('.') < 0 ? t + '.00' : (t.split('.')[1].length === 1 ? t + '0' : t);
  }
  function exact(raw, dec) {
    if (raw === null || raw === undefined) return '';
    var p = decStr(raw, dec === undefined ? 9 : dec);
    return (p.neg ? '-' : '') + p.ip + (p.fp ? '.' + p.fp : '');
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function short(a) { return a.slice(0, 6) + '…' + a.slice(-4); }
  function isAddr(a) { return /^0x[0-9a-fA-F]{40}$/.test(a); }

  /* ========================================================================
     2. RPC：分批 eth_call、端点轮换、超时与回退
     ====================================================================== */
  function postJSON(url, body, timeout) {
    var ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var timer = setTimeout(function () { if (ctl) ctl.abort(); }, timeout);
    return fetch(url, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
      signal: ctl ? ctl.signal : undefined
    }).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function (j) { clearTimeout(timer); return j; },
            function (e) { clearTimeout(timer); throw e; });
  }

  var ranked = {}, primed = {}, dead = {};
  function markDead(chain, url) {
    dead[chain] = dead[chain] || {};
    dead[chain][url] = Date.now() + 90000;      // 90 秒冷却
    var list = ranked[chain] || CHAINS[chain].rpcs.slice();
    var i = list.indexOf(url);
    if (i >= 0) { list.splice(i, 1); list.push(url); ranked[chain] = list; CHAINS[chain].rpcs = list; }
  }
  function alive(chain) {
    var now = Date.now();
    var list = (CHAINS[chain].rpcs || []).filter(function (u) { return !(dead[chain] && dead[chain][u] > now); });
    return list.length ? list : CHAINS[chain].rpcs.slice();
  }
  function promote(chain, url) {
    if (dead[chain]) dead[chain][url] = 0;
    var list = ranked[chain] || CHAINS[chain].rpcs.slice();
    var i = list.indexOf(url);
    if (i > 0) { list.splice(i, 1); list.unshift(url); }
    ranked[chain] = list; CHAINS[chain].rpcs = list;
  }

  /* 首个批次同时打所有端点，取最快的那个（省掉一次测速往返） */
  function race(urls, body, timeout) {
    return new Promise(function (resolve) {
      var done = false, left = urls.length;
      var timer = setTimeout(function () { if (!done) { done = true; resolve(null); } }, timeout + 400);
      urls.forEach(function (u) {
        postJSON(u, body, timeout).then(function (j) {
          if (done) return;
          if (Array.isArray(j) && j.length) { done = true; clearTimeout(timer); resolve({ url: u, json: j }); }
          else if (--left === 0) { done = true; clearTimeout(timer); resolve(null); }
        }, function () {
          if (--left === 0 && !done) { done = true; clearTimeout(timer); resolve(null); }
        });
      });
    });
  }

  async function rpcCall(chain, method, params) {
    var urls = alive(chain), last;
    for (var i = 0; i < urls.length; i++) {
      try {
        var j = await postJSON(urls[i], { jsonrpc: '2.0', id: 1, method: method, params: params }, LIMIT.timeout);
        if (j && j.result !== undefined) return j.result;
        last = new Error(j && j.error ? j.error.message : 'empty');
      } catch (e) { last = e; }
    }
    throw last || new Error('rpc unavailable');
  }

  // 返回数组：string=结果，null=合约调用失败，undefined=网络失败
  async function callMany(chain, calls) {
    var out = new Array(calls.length);
    var jobs = [];
    for (var s = 0; s < calls.length; s += LIMIT.batch) jobs.push([s, calls.slice(s, s + LIMIT.batch)]);

    async function run(offset, group) {
      var body = group.map(function (c, k) {
        return { jsonrpc: '2.0', id: offset + k, method: 'eth_call', params: [{ to: c.to, data: c.data }, 'latest'] };
      });
      var urls = alive(chain), got = null;
      if (!primed[chain]) {
        var first = await race(urls, body, LIMIT.timeout);
        if (first) { got = first.json; promote(chain, first.url); }
        primed[chain] = true;
      }
      for (var i = 0; i < urls.length && !got; i++) {
        try {
          var j = await postJSON(urls[i], body, LIMIT.timeout);
          if (Array.isArray(j) && j.length === group.length) { got = j; promote(chain, urls[i]); }
          else markDead(chain, urls[i]);
        } catch (e) { markDead(chain, urls[i]); }
      }
      if (got) {
        got.forEach(function (item) {
          if (!item || typeof item.id !== 'number') return;
          out[item.id] = item.error ? null : item.result;
        });
        return;
      }
      // 批量被拒时逐条重试
      for (var k2 = 0; k2 < group.length; k2++) {
        for (var u = 0; u < urls.length; u++) {
          try {
            var r = await postJSON(urls[u], {
              jsonrpc: '2.0', id: 0, method: 'eth_call',
              params: [{ to: group[k2].to, data: group[k2].data }, 'latest']
            }, LIMIT.timeout);
            if (r && r.result !== undefined) { out[offset + k2] = r.result; break; }
            if (r && r.error) { out[offset + k2] = null; break; }
          } catch (e) { /* 继续 */ }
        }
      }
    }

    var idx = 0;
    async function worker() {
      while (idx < jobs.length) {
        var job = jobs[idx++];
        await run(job[0], job[1]);
      }
    }
    var ws = []; for (var wq = 0; wq < LIMIT.workers; wq++) ws.push(worker());
    await Promise.all(ws);
    return out;
  }

  /* 区块时间（用于剩余天数），每条链缓存 2 分钟；超时直接放弃，不阻塞总数 */
  var btCache = {};
  async function blockInfo(chain) {
    var hit = btCache[chain];
    if (hit && Date.now() - hit.at < 120000) return hit.val;
    var job = (async function () {
      try {
        var head = await rpcCall(chain, 'eth_getBlockByNumber', ['latest', false]);
        var n = Number(hexToBig(head.number));
        var prev = await rpcCall(chain, 'eth_getBlockByNumber', ['0x' + Math.max(1, n - 50000).toString(16), false]);
        var t2 = Number(hexToBig(head.timestamp)), t1 = Number(hexToBig(prev.timestamp));
        var pn = Number(hexToBig(prev.number));
        var val = { cur: n, ts: t2, spb: (t2 - t1) / Math.max(1, n - pn) };
        btCache[chain] = { at: Date.now(), val: val };
        return val;
      } catch (e) {
        btCache[chain] = { at: Date.now(), val: null };
        return null;
      }
    })();
    var guard = new Promise(function (res) { setTimeout(function () { res(null); }, 6000); });
    return Promise.race([job, guard]);
  }
  function matDate(block, bt) {
    if (!bt || block === null || block === undefined) return null;
    var ts = bt.ts + (Number(block) - bt.cur) * bt.spb;
    var d = new Date(ts * 1000);
    var y = d.getUTCFullYear();
    if (y < 2023 || y > 2035) return null;
    return d.toISOString().slice(0, 10);
  }
  function daysLeft(block, bt) {
    if (!bt || block === null || block === undefined) return null;
    return Math.round((Number(block) - bt.cur) * bt.spb / 86400);
  }

  /* Anubis 部分质押合约的 expiry 字段是秒级时间戳而不是区块号，这里做一次判别 */
  function expiryDate(v, bt) {
    if (v === null || v === undefined || v === 0n) return null;
    var n = Number(v);
    if (n > 2000000000) return new Date(n * 1000).toISOString().slice(0, 10);
    return matDate(v, bt);
  }
  function expiryDays(v, bt) {
    if (v === null || v === undefined || v === 0n) return null;
    var n = Number(v);
    if (n > 2000000000) return Math.round((n * 1000 - Date.now()) / 86400000);
    return daysLeft(v, bt);
  }

  /* ========================================================================
     3. 读取：一条链 × 一个钱包
     ====================================================================== */
  async function readChain(chainKey, wallet) {
    var cfg = CHAINS[chainKey], A = addr32(wallet);
    var res = {
      key: chainKey, cfg: cfg,
      lgns: null, flex: null, warmup: null,
      locks: [], pools: [], bonds: [], rewards: [], extras: [], ilo: null,
      errors: [], bt: null
    };

    var calls = [], slot = {};
    function push(tag, to, data) { slot[tag] = calls.length; calls.push({ to: to, data: data }); }

    push('lgns', cfg.lgns, SEL.balanceOf + A);
    push('flex', cfg.slgns, SEL.balanceOf + A);
    push('warmup', cfg.staking, SEL.warmupInfo + A);
    cfg.longLocks.forEach(function (l, i) {
      push('lockCount' + i, l.addr, SEL.stakesCount + A);
      push('lockTotal' + i, l.addr, SEL.depositorBalance + A);
    });
    cfg.pools.forEach(function (o, i) { push('poolTotal' + i, o.addr, SEL.depositorBalance + A); });
    cfg.bonds.forEach(function (b, i) {
      push('bondLen' + i, b.addr, b.abi === 'burn' ? SEL.depositCount + A : SEL.bondLength + A);
    });
    cfg.rewards.forEach(function (r, i) {
      push('reward' + i, r.addr, r.kind === 'turbine' ? SEL.turbineBal + A : SEL.rewardOf + A);
    });
    cfg.extras.forEach(function (x, i) {
      push('xbal' + i, x.addr, SEL.balanceOf + A);
      if (x.dec === null) push('xdec' + i, x.addr, SEL.decimals);
    });
    if (cfg.ilo) {
      push('iloDiscount', cfg.ilo.discount, SEL.depositorBalance + A);
      push('iloCount', cfg.ilo.lgnsIlo, SEL.depositCount + A);
      push('idoDai', cfg.ilo.idoLedger, SEL.idoTotalDai + A);
    }

    var btP = blockInfo(chainKey);
    var base = await callMany(chainKey, calls);
    var bt = await btP;

    function get(tag) {
      var i = slot[tag];
      if (i === undefined) return undefined;
      return base[i];
    }
    function big(tag) { var v = get(tag); return (v === null || v === undefined) ? null : hexToBig(v); }

    var lg = big('lgns');
    res.lgns = lg === null ? null : { raw: lg, dec: 9 };
    var fx = big('flex');
    res.flex = fx === null ? null : { raw: fx, dec: 9 };
    var wm = get('warmup');
    if (wm === null || wm === undefined) res.warmup = null;
    else { var w = words(wm); res.warmup = { raw: w[0] || 0n }; }

    /* ---- 长期质押（计入） ---- */
    for (var i = 0; i < cfg.longLocks.length; i++) {
      var lc = big('lockCount' + i);
      var lt = big('lockTotal' + i);
      if (lt === null && lc === null) continue;               // 合约不可读，忽略
      res.locks.push({
        label: cfg.longLocks[i].label, addr: cfg.longLocks[i].addr,
        count: lc === null ? null : Number(lc),
        present: lt === null ? 0n : lt,
        items: []
      });
    }

    /* ---- 其他 LGNS 计价质押（计入） ---- */
    for (var j = 0; j < cfg.pools.length; j++) {
      var ot = big('poolTotal' + j);
      if (ot === null) { res.errors.push(cfg.pools[j].label + ' 读取失败（接口变更或已下线）'); continue; }
      res.pools.push({
        label: cfg.pools[j].label, addr: cfg.pools[j].addr, present: ot
      });
    }

    /* ---- 债券 ---- */
    for (var b = 0; b < cfg.bonds.length; b++) {
      var bl = big('bondLen' + b);
      if (bl === null) continue;
      res.bonds.push({
        label: cfg.bonds[b].label, addr: cfg.bonds[b].addr, sym: cfg.bonds[b].sym,
        dec: cfg.bonds[b].dec, abi: cfg.bonds[b].abi || 'bond',
        count: Number(bl), claimable: 0n, payable: 0n, principal: 0n, deposits: []
      });
    }

    /* ---- 奖励 ---- */
    for (var r = 0; r < cfg.rewards.length; r++) {
      var rv = get('reward' + r);
      if (rv === null || rv === undefined) continue;
      var ws = words(rv);
      var kind = cfg.rewards[r].kind;
      var tot = ws[0] || 0n, clm = ws.length > 1 ? (ws[1] || 0n) : 0n;
      var left = tot > clm ? tot - clm : 0n;
      if (kind === 'turbine') { tot = left; clm = 0n; }   // 涡轮接口直接返回可领余额
      res.rewards.push({
        label: cfg.rewards[r].label, addr: cfg.rewards[r].addr, kind: kind,
        total: tot, claimed: clm, raw: left
      });
    }

    /* ---- 其他资产 ---- */
    for (var x = 0; x < cfg.extras.length; x++) {
      var xb = big('xbal' + x);
      if (xb === null) continue;
      var xd = cfg.extras[x].dec;
      if (xd === null) { var dd = big('xdec' + x); xd = dd === null ? 18 : Number(dd); }
      res.extras.push({ label: cfg.extras[x].label, sym: cfg.extras[x].sym, raw: xb, dec: xd });
    }

    /* ---- ILO（仅 Anubis，单独展示、不计入） ---- */
    if (cfg.ilo) {
      var ic = big('iloCount');
      var idoDai = big('idoDai');
      var idsc = big('iloDiscount');
      res.ilo = {
        count: ic === null ? null : Number(ic),
        lgns: 0n, dai: 0n, records: [],
        idoDai: idoDai || 0n,
        discount: idsc === null ? 0n : idsc,      // 创世 360 现值（LGNS，计入）
        online: idsc !== null,
        ok: ic !== null || idoDai !== null || idsc !== null
      };
    }

    /* ---- 细节：长期质押逐笔 ---- */
    var detail = [];
    cfg.longLocks.forEach(function (l, ii) {
      var r0 = res.locks.filter(function (o) { return o.addr === l.addr; })[0];
      if (!r0 || !r0.count) return;
      var n = Math.min(r0.count, LIMIT.entries);
      for (var k = 0; k < n; k++) {
        detail.push({ kind: 'lock', ref: r0, index: k, to: l.addr, data: SEL.stakes + A + u256(k) });
      }
      if (r0.count > LIMIT.entries) res.errors.push(l.label + ' 超过 ' + LIMIT.entries + ' 笔，明细未取全');
    });
    /* ---- 细节：债券逐笔 ---- */
    cfg.bonds.forEach(function (bd) {
      var rr = res.bonds.filter(function (o) { return o.addr === bd.addr; })[0];
      if (!rr || !rr.count) return;
      var n = Math.min(rr.count, LIMIT.entries);
      if (bd.abi === 'burn') {
        for (var k2 = 0; k2 < n; k2++) {
          detail.push({ kind: 'burn', ref: rr, index: k2, to: bd.addr, data: SEL.deposit + A + u256(k2) });
          detail.push({ kind: 'burnClaim', ref: rr, index: k2, to: bd.addr, data: SEL.claimable + A + u256(k2) });
        }
      } else {
        detail.push({ kind: 'bondList', ref: rr, to: bd.addr, data: SEL.bondData + A });
      }
    });
    /* ---- 细节：ILO 逐笔 ---- */
    if (cfg.ilo && res.ilo && res.ilo.count) {
      detail.push({ kind: 'iloList', to: cfg.ilo.lgnsIlo, data: SEL.iloDeposits + A });
    }

    if (detail.length) {
      var det = await callMany(chainKey, detail);
      for (var d = 0; d < detail.length; d++) {
        var it = detail[d], raw = det[d];
        if (raw === null) continue;
        if (it.kind === 'lock') {
          var w2 = words(raw);
          it.ref.items.push({
            principal: w2[0] || 0n,
            gons: w2[1] || 0n,
            matBlock: w2[3] || 0n,
            startBlock: w2[5] || 0n,
            present: null
          });
        } else if (it.kind === 'burn') {
          var w3 = words(raw);
          /* Anubis 销毁债券 getUserDeposit 结构：
             daiValue, capBps, burnedLgns, releasedDaiValue, claimedLgns, ..., mode
             本金取 burnedLgns(2)；旧版若只有 1 个字段则退化为 w3[0] */
          var prin = w3.length >= 9 ? (w3[2] || 0n) : (w3[0] || 0n);
          it.ref.deposits[it.index] = it.ref.deposits[it.index] || {};
          it.ref.deposits[it.index].principal = prin;
          it.ref.principal += prin;
        } else if (it.kind === 'burnClaim') {
          var v = hexToBig(raw);
          it.ref.deposits[it.index] = it.ref.deposits[it.index] || {};
          it.ref.deposits[it.index].claimable = v;
          it.ref.claimable += v;
        } else if (it.kind === 'bondList') {
          var arr = words(raw);
          if (arr.length >= 2) {
            var off2 = Number(arr[0] / 32n), len = Number(arr[off2] || 0n), p = off2 + 1;
            /* 每条 Bond 的字段数按 ABI 实际长度推导：
               Polygon 6 字段 (owner,id,payout,vesting,lastBlock,pricePaid)
               Anubis  8 字段（额外 gons、fee） */
            var stride = len > 0 ? Math.floor((arr.length - p) / len) : 0;
            if (stride < 6) stride = 6;
            for (var q = 0; q < len && p + stride - 1 < arr.length; q++, p += stride) {
              it.ref.deposits.push({
                id: arr[p + 1], payout: arr[p + 2], vesting: arr[p + 3], lastBlock: arr[p + 4],
                pricePaid: arr[p + 5], gons: stride > 6 ? (arr[p + 6] || 0n) : 0n, value: null
              });
            }
          }
        } else if (it.kind === 'iloList') {
          var wr = words(raw);
          if (wr.length >= 2) {
            var off = Number(wr[0] / 32n), n2 = Number(wr[off] || 0n), p2 = off + 1;
            for (var z = 0; z < n2 && p2 + 8 < wr.length; z++, p2 += 9) {
              var rec = {
                dai: wr[p2] || 0n, lgns: wr[p2 + 1] || 0n, lp: wr[p2 + 2] || 0n,
                ts: wr[p2 + 4] || 0n, epoch: wr[p2 + 5] || 0n,
                reward: wr[p2 + 6] || 0n, claimed: wr[p2 + 7] || 0n, mode: Number(wr[p2 + 8] || 0n)
              };
              res.ilo.records.push(rec);
              res.ilo.lgns += rec.lgns;
              res.ilo.dai += rec.dai;
            }
          }
        }
      }
    }

    /* ---- 现值回填：gons -> LGNS（锁仓逐笔、债券逐笔） ---- */
    var priceJobs = [];
    res.locks.forEach(function (l) {
      l.items.forEach(function (it) {
        if (it.gons > 0n) priceJobs.push({ dp: it, to: cfg.slgns, data: SEL.balanceForGons + u256(it.gons) });
      });
    });
    res.bonds.forEach(function (bb) {
      if (bb.abi === 'burn') return;
      bb.deposits.forEach(function (dp) { if (dp && dp.gons > 0n) priceJobs.push({ dp: dp, to: cfg.slgns, data: SEL.balanceForGons + u256(dp.gons) }); });
    });
    if (priceJobs.length) {
      var vals = await callMany(chainKey, priceJobs.map(function (j) { return { to: j.to, data: j.data }; }));
      priceJobs.forEach(function (j, k) {
        var v = vals[k];
        j.dp.present = (v === null || v === undefined) ? null : hexToBig(v);
        j.dp.value = j.dp.present;
      });
    }

    /* ---- 债券应付：普通债券逐笔 pendingPayoutFor，回退 pendingPayout ---- */
    var payJobs = [], payRefs = [];
    res.bonds.forEach(function (bb) {
      if (bb.abi === 'burn') return;
      bb.deposits.forEach(function (dp) {
        if (!dp || dp.id === undefined) return;
        payJobs.push({ to: bb.addr, data: SEL.pendingPayoutFor + A + u256(dp.id) });
        payRefs.push(dp);
      });
    });
    if (payJobs.length) {
      var outs = await callMany(chainKey, payJobs);
      var retry = [];
      payRefs.forEach(function (dp, i) {
        var v = outs[i];
        if (v === null || v === undefined) { retry.push(dp); return; }
        dp.claimable = hexToBig(v);
      });
      if (retry.length) {
        // 回退：pendingPayout(address,uint256)
        var altJobs = [];
        res.bonds.forEach(function (bb) {
          if (bb.abi === 'burn') return;
          bb.deposits.forEach(function (dp) {
            if (dp && retry.indexOf(dp) >= 0) altJobs.push({ dp: dp, to: bb.addr, data: SEL.pendingPayout + A + u256(dp.id) });
          });
        });
        if (altJobs.length) {
          var altOut = await callMany(chainKey, altJobs.map(function (j) { return { to: j.to, data: j.data }; }));
          altJobs.forEach(function (j, i) {
            var v = altOut[i];
            j.dp.claimable = (v === null || v === undefined) ? 0n : hexToBig(v);
          });
        }
      }
    }

    /* ---- 债券汇总：应付按 gons 现值优先，其次 pendingPayout ---- */
    res.bonds.forEach(function (bb) {
      bb.deposits.forEach(function (dp) {
        if (!dp) return;
        var amt = (dp.present !== null && dp.present !== undefined && dp.present > 0n)
          ? dp.present
          : ((dp.claimable || 0n) > 0n ? dp.claimable : (dp.payout || 0n));
        dp.owed = amt;
        bb.payable += amt;
        if (bb.abi === 'burn' && bb.claimable > 0n) bb.payable = bb.claimable;
      });
      if (bb.abi === 'burn') bb.payable = bb.claimable;
    });

    res.bt = bt;
    return res;
  }

  /* ========================================================================
     4. 汇总口径
     ====================================================================== */
  function lockPresent(c) {
    return c.locks.reduce(function (s, l) { return s + (l.present || 0n); }, 0n);
  }
  function lockAccrued(c) {
    var t = 0n;
    c.locks.forEach(function (l) {
      (l.items || []).forEach(function (it) {
        var v = (it.present === null || it.present === undefined) ? null : it.present;
        if (v === null) return;                 // gons 读不到时不算收益，避免虚增
        var diff = v - (it.principal || 0n);
        if (diff > 0n) t += diff;
      });
    });
    return t;
  }
  function poolPresent(c) { return (c.pools || []).reduce(function (s, o) { return s + (o.present || 0n); }, 0n); }
  // 债券：合约记录的应付 LGNS（销毁债券按 getClaimable）
  function bondPayable(c) { return c.bonds.reduce(function (s, b) { return s + (b.payable || 0n); }, 0n); }
  function rewardSum(c) { return c.rewards.reduce(function (s, r) { return s + (r.raw || 0n); }, 0n); }
  // 持仓：钱包 + sLGNS + 预热质押期 + 长期质押现值 + 其他 LGNS 质押现值
  function iloDiscount(c) { return (c.ilo && c.ilo.discount) ? c.ilo.discount : 0n; }
  function holdings(c) {
    return (c.lgns ? c.lgns.raw : 0n) + (c.flex ? c.flex.raw : 0n) +
           (c.warmup ? c.warmup.raw : 0n) + lockPresent(c) + poolPresent(c) + iloDiscount(c);
  }
  // 总币量 = 持仓（含锁仓收益） + 债券应付 + 其它合约待领
  function chainTotal(c) { return holdings(c) + bondPayable(c) + rewardSum(c); }

  async function queryWallet(address) {
    var chains = await Promise.all([readChain('polygon', address), readChain('anubis', address)]);
    return { address: address, chains: chains };
  }

  /* ========================================================================
     5. 渲染
     ====================================================================== */
  function row(label, value, unit, opts) {
    opts = opts || {};
    var cls = 'row' + (opts.cls ? ' ' + opts.cls : '');
    var zero = opts.zero ? ' zero' : '';
    return '<div class="' + cls + zero + '">' +
      '<div class="l">' + label + (opts.sub ? '<small>' + opts.sub + '</small>' : '') + '</div>' +
      '<div class="r"' + (opts.title ? ' title="' + esc(opts.title) + '"' : '') + '>' + value +
      (unit ? '<em>' + unit + '</em>' : '') + '</div></div>';
  }

  function chainCard(c, wallet) {
    var cfg = c.cfg;
    var hold = holdings(c), gold = bondPayable(c), rw = rewardSum(c);
    var total = hold + gold + rw;

    var h = '<section class="card">';

    /* 头部：构成标签最多 4 个，其余折叠成 +N */
    var chips = ['<i>持仓 ' + fmt(hold, 9) + '</i>'];
    if (gold > 0n) chips.push('<i>债券 ' + fmt(gold, 9) + '</i>');
    c.rewards.filter(function (r) { return r.raw > 0n; })
      .forEach(function (r) { chips.push('<i>' + esc(r.short || r.label) + ' ' + fmt(r.raw, 9) + '</i>'); });
    var chipHtml = chips.slice(0, 4).join('') +
      (chips.length > 4 ? '<i>+' + (chips.length - 4) + '</i>' : '');

    h += '<div class="ch">' +
      '<span class="pill ' + cfg.cls + '">' + cfg.name + '</span>' +
      '<div class="tot"><span>本链总币量</span><b>' + fmt2(total, 9) + '</b></div>' +
      '<span class="parts">' + chipHtml + '</span>' +
      '</div>';

    /* 持仓构成 */
    h += '<div class="sec"><div class="sec-h">持仓构成 <span class="hint">计入</span></div>';
    h += row('钱包内自由持有', fmt(c.lgns ? c.lgns.raw : null, 9), 'LGNS',
      { zero: c.lgns && c.lgns.raw === 0n });
    h += row('活期质押 sLGNS', fmt(c.flex ? c.flex.raw : null, 9), 'LGNS',
      { zero: c.flex && c.flex.raw === 0n });
    h += row('预热质押期', fmt(c.warmup ? c.warmup.raw : null, 9), 'LGNS',
      { zero: c.warmup && c.warmup.raw === 0n });
    /* 长期质押与其他质押合并为一行「质押现值」 */
    var stakePresent = lockPresent(c) + poolPresent(c);
    h += row('质押现值', fmt(stakePresent, 9), 'LGNS', {
      cls: 'sum',
      title: '长期质押 ' + exact(lockPresent(c), 9) + ' + 其他质押 ' + exact(poolPresent(c), 9) + ' = ' + exact(stakePresent, 9) + ' LGNS'
    });
    h += '</div>';

    /* 长期质押明细 */
    var activeLocks = c.locks.filter(function (l) { return (l.present || 0n) > 0n || l.items.length; });
    if (activeLocks.length) {
      h += '<details><summary>长期质押明细 <span class="m">' + activeLocks.length + ' 项 · ' +
        activeLocks.reduce(function (s, l) { return s + (l.count || 0); }, 0) + ' 笔</span></summary><div class="dbody">';
      activeLocks.forEach(function (l) {
        h += '<div class="lock"><div class="lock-h"><span>' + esc(l.label) + '</span>' +
          '<span class="m" title="' + esc(exact(l.present || 0n, 9)) + ' LGNS">现值 ' + fmt(l.present, 9) +
          ' · ' + (l.count || 0) + ' 笔</span></div>';
        if (l.items.length) {
          var live = [], closed = 0;
          l.items.forEach(function (it, i) {
            if ((it.principal || 0n) === 0n && (it.gons || 0n) === 0n) { closed++; return; }
            live.push({ it: it, i: i });
          });
          live.forEach(function (o) {
            var it = o.it, md = expiryDate(it.matBlock, c.bt), dl = expiryDays(it.matBlock, c.bt);
            var pres = (it.present === null || it.present === undefined) ? null : it.present;
            var gain = pres === null ? null : (pres - (it.principal || 0n));
            /* 分段拼接：分隔点只允许在 “· ” 之后断行，日期/剩余天数/金额不会被拆开 */
            var segs = ['<span class="nb">本金 <b>' + fmt(it.principal, 9) + '</b></span>'];
            if (pres !== null) segs.push('<span class="nb">现值 <b>' + fmt(pres, 9) + '</b></span>');
            var whenHtml = !md ? '' : (dl !== null && dl < 0
              ? ' <span class="when nb">已于 ' + md + ' 到期</span>'
              : ' <span class="when nb">到期 ' + md +
                (dl !== null ? ' · 剩 ' + dl + ' 天' : '') + '</span>');
            h += '<div class="ent"><span>#' + (o.i + 1) + ' ' + segs.join('\u00a0· ') + whenHtml + '</span>' +
              '<span class="rr"><i>已计息</i><b>' + fmt(gain, 9) + '</b></span></div>';
          });
          if (closed) {
            h += '<div class="ent muted">' +
              '另有 ' + closed + ' 笔历史记录已结清（本金 0），不计入</div>';
          }
        }
        h += '</div>';
      });
      h += '</div></details>';
    }

    /* 其他质押（计入） */
    if (c.pools.length) {
      h += '<details><summary>' + (cfg.key === 'polygon' ? '能量额度 / A Stake（计入）' : '其他质押（计入）') +
        ' <span class="m">' + fmt(poolPresent(c), 9) + '</span></summary><div class="dbody">';
      c.pools.forEach(function (o) {
        h += row(esc(o.label), fmt(o.present, 9), 'LGNS', {
          zero: o.present === 0n
        });
      });
      h += '</div></details>';
    }

    /* ILO（仅 Anubis）：官网 /ilo 页 = 创世 360 + ILO(LGNS) + ILO(DAI) */
    if (cfg.ilo && c.ilo) {
      var ilo = c.ilo;
      var hasAny = (ilo.count || 0) > 0 || ilo.idoDai > 0n || (ilo.discount || 0n) > 0n;
      h += '<details><summary>ILO（Anubis） <span class="m">' +
        (hasAny
          ? ((ilo.discount || 0n) > 0n ? '创世 ' + fmt(ilo.discount, 9) : '无创世仓位') +
            ((ilo.count || 0) > 0 ? ' · ' + ilo.count + ' 笔' : '') + (ilo.idoDai > 0n ? ' · 含 DAI' : '')
          : '无记录') +
        '</span></summary><div class="dbody">';
      h += row('创世 360（Discount Staking）', fmt(ilo.discount, 9), 'LGNS', {
        zero: (ilo.discount || 0n) === 0n
      });
      h += row('ILO（LGNS 申购）笔数', String(ilo.count || 0), '笔', { zero: !ilo.count });
      h += row('ILO（LGNS 申购）累计 LGNS', fmt(ilo.lgns, 9), 'LGNS', { zero: ilo.lgns === 0n });
      h += row('ILO（DAI 申购）累计 DAI', fmt(ilo.idoDai, 18), 'DAI', { zero: ilo.idoDai === 0n });
      (ilo.records || []).slice(-10).reverse().forEach(function (rec, i) {
        var when = rec.ts ? new Date(Number(rec.ts) * 1000).toISOString().slice(0, 10) : '';
        var rsegs = [];
        if (when) rsegs.push('<span class="nb">' + when + '</span>');
        rsegs.push('<span class="nb">LGNS <b>' + fmt(rec.lgns, 9) + '</b></span>');
        if (rec.dai > 0n) rsegs.push('<span class="nb">DAI <b>' + fmt(rec.dai, 18) + '</b></span>');
        h += '<div class="ent"><span>#' + (i + 1) + ' ' + rsegs.join('\u00a0· ') +
          '</span><span class="rr"><i>奖励</i><b>' + fmt(rec.reward, 9) + '</b></span></div>';
      });
      h += '</div></details>';
    }

    /* 债券 */
    if (c.bonds.length) {
      var heldBonds = c.bonds.filter(function (b) { return b.count > 0; });
      h += '<details><summary>债券（计入） <span class="m">' +
        (heldBonds.length ? fmt(gold, 9) + ' LGNS' : c.bonds.length + ' 类 · 无持仓') + '</span></summary><div class="dbody">';
      if (!heldBonds.length) {
        h += '<div class="ent muted"><span>当前无存入</span></div>';
      }
      heldBonds.forEach(function (b) {
        h += '<div class="lock"><div class="lock-h"><span>' + esc(b.label) + '</span>' +
          '<span class="m">' + b.count + ' 笔 · 应付 ' + fmt(b.payable, 9) + '</span></div>';
        if (b.principal > 0n) {
          h += '<div class="ent"><span>存入本金 <b>' + (b.abi === 'burn'
            ? fmt(b.principal, 9) + ' LGNS<span class="nb">（已销毁）</span>'
            : fmt(b.principal, b.dec) + ' ' + esc(b.sym)) + '</b></span>' +
            '<span class="rr"><i>可领</i><b>' + fmt(b.claimable, 9) + '</b></span></div>';
        }
        b.deposits.forEach(function (d, i) {
          if (!d) return;
          var owed = (d.owed !== undefined && d.owed !== null) ? d.owed : (d.claimable || 0n);
          h += '<div class="ent ent-sub"><span>#' + (i + 1) + ' <span class="nb">存入 ' +
            (b.abi === 'burn' ? fmt(d.principal, 9) + ' LGNS' : fmt(d.payout, 9) + ' LGNS') +
            '</span></span><span class="rr"><i>应付</i><b>' + fmt(owed, 9) + '</b></span></div>';
        });
        h += '</div>';
      });
      h += '</div></details>';
    }

    /* 其它合约待领（计入） */
    if (c.rewards.length) {
      h += '<details><summary>' + (cfg.key === 'polygon' ? '涡轮 / 蜘蛛网 / 社区奖励（计入）' : '涡轮 / 蜘蛛网 / DAO 奖励（计入）') +
        ' <span class="m">' + fmt(rw, 9) + '</span></summary><div class="dbody">';
      c.rewards.forEach(function (r) {
        h += row(esc(r.label), fmt(r.raw, 9), 'LGNS', {
          zero: r.raw === 0n,
          sub: r.kind === 'turbine' ? '' : '累计 ' + fmt(r.total, 9) + ' · 已领 ' + fmt(r.claimed, 9),
          title: r.kind === 'turbine'
            ? 'getTurbineBal 返回的可领余额'
            : '未领取 = 累计 ' + exact(r.total, 9) + ' − 已领 ' + exact(r.claimed, 9)
        });
      });
      h += '</div></details>';
    }

    /* 长期质押已计息：仅参考 */
    if (lockAccrued(c) > 0n) {
      h += '<details><summary>长期质押已计息（仅参考，不叠加） <span class="m">' + fmt(lockAccrued(c), 9) + '</span></summary><div class="dbody">';
      h += row('逐笔现值 − 本金 合计', fmt(lockAccrued(c), 9), 'LGNS');
      h += '</div></details>';
    }

    /* 其他资产 */
    var nz = c.extras.filter(function (x) { return x.raw > 0n; });
    h += '<details><summary>钱包其他资产 <span class="m">' +
      (nz.length ? nz.length + ' 项有余额' : '无') + '</span></summary><div class="dbody">';
    (nz.length ? nz : c.extras).forEach(function (x) {
      h += row(esc(x.label), fmt(x.raw, x.dec), esc(x.sym), { zero: x.raw === 0n });
    });
    h += '</div></details>';

    if (c.errors.length) h += '<div class="errbox">' + esc(c.errors.join('；')) + '</div>';
    h += '</section>';
    return h;
  }

  function walletBlock(w, idx, total2) {
    var p = w.chains[0], a = w.chains[1];
    var tp = chainTotal(p), ta = chainTotal(a);
    var open = (total2 <= 1);
    var h = '<div class="wallet' + (open ? ' open' : '') + '" id="w' + ((idx || 0) + 1) + '">';
    h += '<div class="wallet-head" role="button" tabindex="0" aria-expanded="' + (open ? 'true' : 'false') + '">' +
      '<span class="chev" aria-hidden="true"></span>' +
      '<span class="wleft">' +
      ((total2 > 1) ? '<span class="idx">#' + ((idx || 0) + 1) + '</span>' : '') +
      '<span class="waddr" title="' + esc(w.address) + '">' + esc(short(w.address)) + '</span>' +
      '</span>' +
      '<span class="wallet-sum">' +
        '<span class="stat"><em>Polygon</em><b>' + fmt(tp, 9) + '</b></span>' +
        '<span class="stat"><em>Anubis</em><b>' + fmt(ta, 9) + '</b></span>' +
        '<span class="stat total"><em>TOTAL</em><b>' + fmt2(tp + ta, 9) + '</b></span>' +
      '</span></div>';
    h += '<div class="wbody"><div class="grid">' + chainCard(p, w.address) + chainCard(a, w.address) + '</div></div>';
    h += '</div>';
    return h;
  }

  function render(wallets) {
    var P = 0n, A = 0n, goldP = 0n, goldA = 0n, rwAll = 0n, free = 0n, flex = 0n, warm = 0n, lock = 0n, pool = 0n, discAll = 0n;
    wallets.forEach(function (w) {
      var p = w.chains[0], a = w.chains[1];
      P += holdings(p); A += holdings(a);
      pool += poolPresent(p) + poolPresent(a);
      discAll += iloDiscount(p) + iloDiscount(a);
      goldP += bondPayable(p); goldA += bondPayable(a);
      rwAll += rewardSum(p) + rewardSum(a);
      free += (p.lgns ? p.lgns.raw : 0n) + (a.lgns ? a.lgns.raw : 0n);
      flex += (p.flex ? p.flex.raw : 0n) + (a.flex ? a.flex.raw : 0n);
      warm += (p.warmup ? p.warmup.raw : 0n) + (a.warmup ? a.warmup.raw : 0n);
      lock += lockPresent(p) + lockPresent(a);
    });
    var hold = P + A, gold = goldP + goldA, total = hold + gold + rwAll;
    var chainP = walletChainTotal(wallets, 0), chainA = walletChainTotal(wallets, 1);

    var h = '';
    h += '<div class="hero">' +
      '<div><div class="k">总币量 <i>持仓 + 债券 + 奖励</i>' +
      (wallets.length > 1 ? '<i class="n">' + wallets.length + ' 个钱包</i>' : '') + '</div>' +
      '<div class="v" title="' + esc(exact(total, 9)) + '">' + fmt2(total, 9) + '<small>LGNS</small></div>' +
      '<div class="eq">钱包\u00a0' + fmt(free, 9) + ' + 活期\u00a0' + fmt(flex, 9) + ' + 预热质押期\u00a0' + fmt(warm, 9) +
      ' + 质押现值\u00a0' + fmt(lock + pool, 9) +
      (discAll > 0n ? ' + 创世360\u00a0' + fmt(discAll, 9) : '') + (gold > 0n ? ' + 债券\u00a0' + fmt(gold, 9) : '') +
      (rwAll > 0n ? ' + 奖励待领\u00a0' + fmt(rwAll, 9) : '') + '</div></div>' +
      '<div class="hero-side">' +
      '<div class="mini"><span>其中持仓</span><b>' + fmt(hold, 9) + '</b></div>' +
      '<div class="mini mute"><span>债券 / 奖励待领</span><b>' + fmt(gold + rwAll, 9) + '</b></div>' +
      '</div>' +
      '<div class="split">' +
      '<div class="bar"><div class="t"><span>Polygon</span><b>' + fmt(chainP, 9) + '</b></div><div class="track"><div class="fill" style="width:' + pct(chainP, total) + '%"></div></div></div>' +
      '<div class="bar"><div class="t"><span>Anubis</span><b>' + fmt(chainA, 9) + '</b></div><div class="track"><div class="fill" style="width:' + pct(chainA, total) + '%"></div></div></div>' +
      '</div></div>';

    wallets.forEach(function (w, i) { h += walletBlock(w, i, wallets.length); });
    return h;
  }
  function walletChainTotal(wallets, idx) {
    var t = 0n;
    wallets.forEach(function (w) { t += chainTotal(w.chains[idx]); });
    return t;
  }
  function pct(a, b) {
    if (!b) return 0;
    var v = Number(a * 10000n / b) / 100;
    return Math.max(0, Math.min(100, v));
  }

  /* ========================================================================
     6. 交互
     ====================================================================== */
  var $ = function (id) { return document.getElementById(id); };
  var state = { busy: false, last: null };
  var WKEY = 'lgns_holdings_wallets_v3';

  function parseAddrs(text) {
    var raw = String(text || '').split(/[\s,;，；、]+/).filter(Boolean);
    var valid = [], invalid = [], seen = {};
    raw.forEach(function (a) {
      if (!isAddr(a)) { invalid.push(a); return; }
      var k = a.toLowerCase();
      if (seen[k]) return;
      seen[k] = 1; valid.push(a);
    });
    return { valid: valid, invalid: invalid };
  }
  function skeleton() {
    var one = '<div class="sk-card"><div class="sk-line sk-big"></div><div class="sk-line w90"></div>' +
      '<div class="sk-line w70"></div><div class="sk-line w50"></div></div>';
    var two = '<div class="sk-card"><div class="sk-line w30"></div><div class="sk-line w90"></div>' +
      '<div class="sk-line w70"></div><div class="sk-line w50"></div><div class="sk-line w90"></div></div>';
    return '<div class="skel">' + one + '<div class="grid">' + two + two + '</div></div>';
  }
  function setStatus(html, cls) {
    var el = $('status');
    el.className = 'status' + (cls ? ' ' + cls : '');
    el.innerHTML = html;
  }
  /* 只改按钮文案，保住液态玻璃的边缘层与镜面结构 */
  function setGoLabel(t) {
    var b = $('go'), l = b.querySelector('.lg-label');
    if (l) l.textContent = t; else b.textContent = t;
  }
  function loadSaved() {
    try { return JSON.parse(localStorage.getItem(WKEY) || '[]').filter(isAddr); } catch (e) { return []; }
  }
  function saveSaved(list) {
    try { localStorage.setItem(WKEY, JSON.stringify(list)); } catch (e) {}
  }

  async function run() {
    if (state.busy) return;
    var p = parseAddrs($('addr').value);
    if (p.invalid.length) {
      setStatus('地址格式不对：' + esc(p.invalid.slice(0, 3).join(', ')) + '（需 0x 开头 42 位）', 'err');
      return;
    }
    if (!p.valid.length) { setStatus('请先输入至少一个钱包地址', 'err'); return; }
    if (p.valid.length > LIMIT.wallets) {
      setStatus('一次最多 ' + LIMIT.wallets + ' 个钱包', 'err');
      return;
    }

    state.busy = true;
    $('go').disabled = true;
    setGoLabel('查询中…');
    $('empty').style.display = 'none';
    $('out').innerHTML = skeleton();
    saveSaved(p.valid);
    setStatus('<span class="spin"></span>正在读取 ' + p.valid.length + ' 个钱包的双链数据…', 'live');

    try {
      var done = 0, results = new Array(p.valid.length);
      var next = 0;
      async function worker() {
        while (next < p.valid.length) {
          var i = next++;
          results[i] = await queryWallet(p.valid[i]);
          done++;
          setStatus('<span class="spin"></span>已完成 ' + done + ' / ' + p.valid.length + ' 个钱包…', 'live');
        }
      }
      await Promise.all([worker(), worker()]);

      state.last = results;
      $('out').innerHTML = render(results);
      $('out').firstChild && $('out').firstChild.classList.add('fade');

      var errs = 0;
      results.forEach(function (w) {
        w.chains.forEach(function (c) { errs += c.errors.length; });
      });
      setStatus('✓ 查询完成 · ' + new Date().toLocaleString('zh-CN') +
        (errs ? ' · ' + errs + ' 项提示' : ''), 'live');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      setStatus('查询失败：' + esc(e && e.message ? e.message : '网络异常') + '。可稍后重试。', 'err');
    } finally {
      state.busy = false;
      $('go').disabled = false;
      setGoLabel('查询持仓');
    }
  }


  function init() {
    $('go').addEventListener('click', run);
    $('clear').addEventListener('click', function () {
      $('addr').value = '';
      $('out').innerHTML = '';
      $('empty').style.display = '';
      state.last = null;
      try { localStorage.removeItem(WKEY); } catch (e) {}   // 同时清掉本机记住的钱包
      setStatus('已清空输入与本机记住的钱包');
      $('addr').focus();
