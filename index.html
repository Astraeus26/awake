<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,follow">
<meta name="color-scheme" content="dark">
<title>双链 LGNS 总币量查询 · 持仓 + 债券</title>
<meta name="description" content="查询钱包在 Polygon 与 Anubis 的 LGNS 总币量：钱包余额、活期 sLGNS、预热质押期、长期质押现值、A Stake / 能量额度 / 即时・债券・能量点数・创世360 质押现值，以及债券应收 LGNS 与涡轮・蜘蛛网・DAO 待领。">
<style>
:root{
  color-scheme: light dark;
  --ink:#111114;
  --ink-2:#3c3c43;
  --ink-3:#6b6b70;
  --dim:#8a8a8f;
  --acc:#0a84ff;
  --acc-2:#0066d6;
  --glass:rgba(255,255,255,.58);
  --glass-2:rgba(255,255,255,.44);
  --glass-3:rgba(255,255,255,.30);
  --brd:rgba(255,255,255,.75);
  --hair:rgba(60,60,67,.12);
  --hi:rgba(255,255,255,.9);
  --shadow:0 18px 50px rgba(23,43,77,.14),0 2px 8px rgba(23,43,77,.06);
  --sheen:rgba(255,255,255,.55);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  --r-lg:26px;
  --r-md:18px;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#f2f2f7;
    --ink-2:#d1d1d6;
    --ink-3:#a1a1aa;
    --dim:#8b8b93;
    --acc:#0a84ff;
    --acc-2:#5ac8fa;
    --glass:rgba(32,34,41,.62);
    --glass-2:rgba(32,34,41,.50);
    --glass-3:rgba(30,32,38,.38);
    --brd:rgba(255,255,255,.16);
    --hair:rgba(255,255,255,.12);
    --hi:rgba(255,255,255,.16);
    --shadow:0 18px 50px rgba(0,0,0,.5),0 2px 10px rgba(0,0,0,.3);
    --sheen:rgba(255,255,255,.10);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
html,body{margin:0}
body{
  min-height:100vh;color:var(--ink);
  font:15px/1.56 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  letter-spacing:.002em;
  background:
    radial-gradient(1100px 760px at 12% -6%,#d6e6ff 0%,transparent 62%),
    radial-gradient(980px 720px at 88% 2%,#ecdcff 0%,transparent 64%),
    radial-gradient(880px 820px at 66% 98%,#d6f6ef 0%,transparent 62%),
    radial-gradient(760px 620px at 6% 90%,#ffe1ef 0%,transparent 60%),
    linear-gradient(180deg,#f7f9fd,#eaeff7 58%,#e5ebf5);
  background-attachment:fixed;
}
@media (prefers-color-scheme: dark){
  body{
    background:
      radial-gradient(1100px 760px at 12% -6%,#1d3054 0%,transparent 64%),
      radial-gradient(980px 720px at 88% 2%,#33245a 0%,transparent 66%),
      radial-gradient(880px 820px at 66% 98%,#123939 0%,transparent 64%),
      radial-gradient(700px 520px at 4% 92%,#3a1f33 0%,transparent 62%),
      linear-gradient(180deg,#0b0d12,#080a0f 60%,#06080c);
  }
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.28;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.06'/></svg>");
}
.shell{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:clamp(26px,5vw,54px) 18px 76px}

/* ---------- 头部 ---------- */
/* topbar */
.topbar{
  margin:0 0 18px;padding:10px 15px;border-radius:14px;
  background:var(--glass-3);border:1px solid var(--hair);
  box-shadow:inset 0 1px 0 var(--hi);
  -webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);
  display:flex;align-items:center;gap:9px;min-width:0;
}
.dot{width:7px;height:7px;border-radius:50%;background:#34c759;box-shadow:0 0 10px rgba(52,199,89,.7);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45;box-shadow:0 0 3px rgba(52,199,89,.35)}}
h1{margin:0 0 10px;font-size:clamp(27px,4.6vw,36px);line-height:1.12;letter-spacing:-.025em;font-weight:700}
h1 em{font-style:normal;background:linear-gradient(94deg,#0a84ff,#5e5ce6 62%,#bf5af2);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;text-wrap:balance}
.sub{margin:0;flex:1 1 auto;min-width:0;font-size:12px;line-height:1.5;letter-spacing:.004em;color:var(--ink-3)}
.sub b{color:var(--ink-2);font-weight:600}

/* ---------- 输入 ---------- */
.qcard{
  position:relative;padding:12px;border-radius:var(--r-lg);
  background:var(--glass);border:1px solid var(--brd);
  -webkit-backdrop-filter:blur(32px) saturate(190%);backdrop-filter:blur(32px) saturate(190%);
  box-shadow:var(--shadow),inset 0 1px 0 var(--hi);
}
textarea.q{
  display:block;width:100%;min-height:78px;resize:vertical;padding:14px 15px;
  color:var(--ink);background:var(--glass-3);border:1px solid var(--hair);border-radius:14px;
  font:13px/1.65 var(--mono);letter-spacing:.2px;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
textarea.q::placeholder{color:var(--dim)}
textarea.q:focus{outline:none;border-color:rgba(10,132,255,.5);box-shadow:0 0 0 4px rgba(10,132,255,.14);background:var(--glass-2)}
.qrow{display:flex;gap:10px;margin-top:11px;flex-wrap:wrap}
button{font:inherit;cursor:pointer}
.btn{
  flex:1 1 auto;min-height:48px;padding:12px 22px;border-radius:14px;border:1px solid rgba(0,80,180,.28);
  font-weight:600;font-size:15px;color:#fff;letter-spacing:.01em;
  background:linear-gradient(180deg,#3d9bff,#0a7bf0);
  box-shadow:0 10px 24px rgba(10,132,255,.28),inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .18s cubic-bezier(.2,.8,.3,1),box-shadow .18s,filter .18s;
}
.btn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 14px 30px rgba(10,132,255,.34),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:active:not(:disabled){transform:scale(.985);filter:brightness(.97)}
.btn:disabled{opacity:.5;cursor:default;filter:saturate(.7)}
.btn.ghost{
  flex:0 0 auto;color:var(--ink-2);font-weight:500;font-size:14px;padding:12px 18px;
  background:var(--glass-3);border:1px solid var(--hair);box-shadow:inset 0 1px 0 var(--hi);
  -webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);
}
.btn.ghost:hover{color:var(--ink);background:var(--glass-2);transform:none}
.status{margin-left:auto;flex:0 0 auto;font-size:11.5px;color:var(--ink-3);text-align:right;line-height:1.5;white-space:nowrap}
.status.live{color:var(--ink-2)}
.status.err{color:#d70015}
@media (prefers-color-scheme: dark){.status.err{color:#ff6961}}
.spin{display:inline-block;width:12px;height:12px;margin-right:8px;vertical-align:-1px;border:2px solid rgba(120,120,128,.25);border-top-color:var(--acc);border-radius:50%;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

/* ---------- 概要 ---------- */
.hero{
  margin-top:18px;padding:22px 24px;border-radius:var(--r-lg);border:1px solid var(--brd);
  background:var(--glass);
  -webkit-backdrop-filter:blur(34px) saturate(190%);backdrop-filter:blur(34px) saturate(190%);
  box-shadow:var(--shadow),inset 0 1px 0 var(--hi);
  display:grid;grid-template-columns:1.4fr .9fr;gap:18px;align-items:end;
}
.hero .k{font-size:12px;color:var(--ink-3);letter-spacing:.01em;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.hero .k i{font-style:normal;font-size:10.5px;padding:4px 9px;border-radius:999px;background:rgba(10,132,255,.1);color:var(--acc-2);border:1px solid rgba(10,132,255,.16)}
.hero .k i.n{background:rgba(120,120,128,.12);color:var(--ink-3);border-color:var(--hair)}
.hero .v{margin:8px 0 6px;font:700 clamp(33px,6.6vw,46px)/1.02 var(--mono);letter-spacing:-1.6px;color:var(--ink);font-variant-numeric:tabular-nums}
.hero .v small{font-size:.38em;letter-spacing:0;color:var(--dim);margin-left:8px;font-weight:600;font-family:-apple-system,system-ui,sans-serif}
.hero .eq{font-size:11.8px;color:var(--dim);letter-spacing:.005em}
.hero-side{display:grid;gap:9px}
.mini{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:11px 14px;border-radius:14px;
  background:var(--glass-3);border:1px solid var(--hair);box-shadow:inset 0 1px 0 var(--hi)}
.mini span{font-size:11.5px;color:var(--ink-3)}
.mini b{font:600 14.5px/1 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.mini.mute b{color:var(--ink-2);font-weight:500}
.split{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.bar{padding:11px 14px;border-radius:14px;background:var(--glass-3);border:1px solid var(--hair);overflow:hidden}
.bar .t{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-3);margin-bottom:8px}
.bar .t b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink-2);font-weight:600}
.bar .track{height:5px;border-radius:99px;background:rgba(120,120,128,.2);overflow:hidden}
.bar .fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#0a84ff,#5e5ce6);transition:width .7s cubic-bezier(.2,.8,.3,1)}

/* ---------- 钱包 / 链卡 ---------- */
.wallet{margin-top:20px;display:block}
.wallet .wbody{display:none}
.wallet.open .wbody{display:block}
/* 钱包行：单行三列表（跨行严格对齐） */
.wallet-head{
  cursor:pointer;user-select:none;
  display:grid;grid-template-columns:18px minmax(0,1fr) auto;
  align-items:center;column-gap:14px;
  padding:12px 16px;border-radius:18px;margin-bottom:10px;
  background:var(--glass-2);border:1px solid var(--brd);
  -webkit-backdrop-filter:blur(28px) saturate(185%);backdrop-filter:blur(28px) saturate(185%);
  box-shadow:0 10px 26px rgba(23,43,77,.09),inset 0 1px 0 var(--hi);
  transition:background .2s,box-shadow .2s,transform .2s;
}
.wallet-head:hover{background:var(--glass);box-shadow:0 14px 34px rgba(23,43,77,.13),inset 0 1px 0 var(--hi)}
.wallet-head:active{transform:scale(.998)}
.wallet-head:focus-visible{outline:3px solid rgba(10,132,255,.45);outline-offset:2px}
.wallet.open .wallet-head{background:var(--glass);border-color:rgba(10,132,255,.26)}
.wallet .chev{width:6.5px;height:6.5px;border-right:1.6px solid var(--ink-3);border-bottom:1.6px solid var(--ink-3);
  transform:rotate(-45deg);transition:transform .25s cubic-bezier(.2,.8,.3,1),border-color .2s;
  justify-self:center;margin:0 0 2px 0}
.wallet.open .chev{transform:rotate(45deg);border-color:var(--acc)}
.wleft{display:flex;align-items:center;gap:10px;min-width:0}
.wallet-head .idx{
  flex:0 0 auto;font:600 10.5px/1 var(--mono);color:var(--ink-3);letter-spacing:.04em;
  background:rgba(120,120,128,.12);border:1px solid var(--hair);
  border-radius:999px;padding:5px 9px;min-width:30px;text-align:center;
}
.waddr{font:600 14.5px/1 var(--mono);color:var(--ink);letter-spacing:.02em;
  padding-bottom:1px;border-bottom:1px dashed transparent;transition:border-color .2s;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wallet-head:hover .waddr{border-bottom-color:var(--hair)}

/* 固定列宽 → 每个钱包的同一列在竖直方向完全对齐 */
.wallet-sum{
  display:grid;grid-template-columns:150px 150px 150px;
  align-items:baseline;justify-items:start;column-gap:20px;
}
.wallet-sum .stat{display:flex;align-items:baseline;justify-content:flex-start;gap:5px;min-width:0;white-space:nowrap}
.wallet-sum .stat em{font-style:normal;font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);opacity:.85;
  transform:translateY(-1px);margin-left:-.11em;flex:0 0 auto}
/* 三列数字统一字体、字号、字距，仅用字重区分合计 */
.wallet-sum .stat b{font:600 14px/1 var(--mono);color:var(--ink-2);font-variant-numeric:tabular-nums;letter-spacing:-.1px}
.wallet-sum .stat.total b{font-weight:700;color:var(--ink);letter-spacing:-.1px;
  display:flex;align-items:baseline;justify-content:flex-start;gap:6px}


.grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:880px){.grid{grid-template-columns:1fr 1fr}}

.card{
  position:relative;padding:18px;border-radius:var(--r-lg);border:1px solid var(--brd);
  background:var(--glass);
  -webkit-backdrop-filter:blur(30px) saturate(185%);backdrop-filter:blur(30px) saturate(185%);
  box-shadow:var(--shadow),inset 0 1px 0 var(--hi);
  transition:box-shadow .25s,transform .25s;
  display:flex;flex-direction:column;
}
.card:hover{box-shadow:0 22px 60px rgba(23,43,77,.18),inset 0 1px 0 var(--hi)}
.ch{
  display:grid;grid-template-columns:auto minmax(0,1fr);
  grid-template-areas:"pill tot" "parts parts";
  align-items:start;column-gap:12px;row-gap:10px;margin-bottom:14px;
}
.pill{grid-area:pill;justify-self:start;align-self:center;
  font:600 10.5px/1 var(--mono);letter-spacing:.06em;padding:6px 10px;border-radius:999px;border:1px solid;text-transform:uppercase}
.pill.poly{color:#5b3fd6;background:rgba(94,92,230,.12);border-color:rgba(94,92,230,.22)}
.pill.anb{color:#0066d6;background:rgba(10,132,255,.12);border-color:rgba(10,132,255,.22)}
@media (prefers-color-scheme: dark){
  .pill.poly{color:#c7b8ff;background:rgba(94,92,230,.18);border-color:rgba(160,140,255,.28)}
  .pill.anb{color:#8fd0ff;background:rgba(10,132,255,.18);border-color:rgba(90,200,250,.28)}
}
.ch .tot{grid-area:tot;justify-self:end;text-align:right;line-height:1.25}
.ch .tot>span{display:block;font-size:10.5px;color:var(--dim);letter-spacing:.02em}
.ch .tot b{font:700 17px/1.25 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.ch .parts{grid-area:parts;display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-width:0}
.ch .parts i{display:inline-block;font-style:normal;font-size:10px;line-height:1.5;color:var(--ink-3);
  border:1px solid var(--hair);border-radius:999px;padding:2px 8px;background:var(--glass-3);white-space:nowrap}

.sec{margin-top:14px;padding:4px 16px 6px;border-radius:16px;
  background:var(--glass-2);border:1px solid var(--brd);box-shadow:inset 0 1px 0 var(--hi);
  -webkit-backdrop-filter:blur(24px) saturate(185%);backdrop-filter:blur(24px) saturate(185%)}
.sec-h{display:flex;align-items:center;gap:8px;font:600 10.5px/1.3 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);padding:12px 0 4px}
.sec-h .hint{margin-left:auto;font:600 9.5px/1 var(--mono);letter-spacing:.06em;text-transform:none;padding:4px 8px;border-radius:999px;background:rgba(52,199,89,.12);color:#1a8f3c}
.sec-h .hint.off{background:rgba(255,159,10,.14);color:#b26a00}
@media (prefers-color-scheme: dark){
  .sec-h .hint{color:#5ee07f;background:rgba(52,199,89,.16)}
  .sec-h .hint.off{color:#ffc46b;background:rgba(255,159,10,.16)}
}

.row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:11px 0;margin:0;
  border-bottom:1px solid var(--hair);border-radius:0;background:none;transition:background .15s}
.row:last-child{border-bottom:0}
.row:hover{background:rgba(120,120,128,.06)}
.row .l{font-size:13.2px;color:var(--ink-2);min-width:0;font-weight:400}
.row .l small{display:block;color:var(--dim);font-size:11px;margin-top:3px;line-height:1.5;font-weight:400}
.row .r{font:600 13.5px/1.35 var(--mono);color:var(--ink);white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.row .r em{font-style:normal;color:var(--dim);font-size:10.5px;margin-left:5px;font-family:-apple-system,system-ui,sans-serif;font-weight:500}
.row.sum .l{font-weight:600;color:var(--ink)}
.row.sum .r{color:var(--acc-2);font-weight:700;font-size:14.5px}
@media (prefers-color-scheme: dark){.row.sum .r{color:#5ac8fa}}
.row.zero .r{color:var(--dim)}
.row.zero .l{color:var(--ink-3)}

details{margin-top:8px;border-radius:16px;overflow:hidden;
  background:var(--glass-2);border:1px solid var(--brd);box-shadow:inset 0 1px 0 var(--hi);
  -webkit-backdrop-filter:blur(24px) saturate(185%);backdrop-filter:blur(24px) saturate(185%)}
details>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:8px 13px;
  font-size:12.5px;font-weight:600;color:var(--ink-2);transition:background .18s;min-height:0;line-height:1.4}
details>summary:hover{background:rgba(120,120,128,.06)}
details>summary::-webkit-details-marker{display:none}
details[open]>summary{border-bottom:1px solid var(--hair);color:var(--ink)}
details>summary .m{margin-left:auto;font:600 11.5px var(--mono);color:var(--ink-3);font-variant-numeric:tabular-nums}
/* 折叠箭头与钱包行一致：放在最左侧 */
details>summary::before{content:"";width:6px;height:6px;flex:0 0 auto;
  margin:0 5px 1px 1px;
  border-right:1.6px solid var(--ink-3);border-bottom:1.6px solid var(--ink-3);
  transform:rotate(-45deg);transition:transform .25s cubic-bezier(.2,.8,.3,1),border-color .2s}
details[open]>summary::before{transform:rotate(45deg);border-color:var(--acc)}
details>summary::after{content:none}
.dbody{padding:4px 13px 12px}
.lock{padding:12px 0;border-top:1px solid var(--hair)}
.lock:first-child{border-top:0;padding-top:2px}
.lock-h{display:flex;justify-content:space-between;gap:10px;align-items:baseline;font-size:12.8px;color:var(--ink-2);margin-bottom:6px;font-weight:500}
.lock-h .m{font:500 12px var(--mono);color:var(--ink-3);white-space:nowrap;font-variant-numeric:tabular-nums}
.ent{display:flex;justify-content:space-between;gap:10px;font-size:11.8px;color:var(--ink-3);padding:6px 0;border-left:0}
.ent b{font-family:var(--mono);color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.ent .rr{text-align:right;white-space:nowrap;color:var(--dim)}
.ent .rr b{color:var(--ink-2)}
.ent .when{color:var(--dim)}
.ent.muted{color:var(--dim)}
.ent.sub{opacity:.92}

.errbox{margin-top:12px;padding:11px 13px;border-radius:12px;background:rgba(255,59,48,.08);border:1px solid rgba(255,59,48,.2);color:#c40015;font-size:11.5px;line-height:1.65}
@media (prefers-color-scheme: dark){.errbox{color:#ff8f87;background:rgba(255,69,58,.12)}}

.skel{display:grid;gap:12px;margin-top:20px}
.sk-card{padding:20px;border-radius:var(--r-lg);border:1px solid var(--brd);background:var(--glass-2);box-shadow:inset 0 1px 0 var(--hi)}
.sk-line{height:12px;border-radius:6px;margin-bottom:11px;background:linear-gradient(90deg,rgba(120,120,128,.1),rgba(120,120,128,.22),rgba(120,120,128,.1));background-size:220% 100%;animation:sk 1.5s ease-in-out infinite}
.sk-line:last-child{margin-bottom:0}
.sk-big{height:30px;width:46%;border-radius:8px;margin-bottom:16px}
.w30{width:30%}.w50{width:50%}.w70{width:70%}.w90{width:90%}
@keyframes sk{0%{background-position:120% 0}100%{background-position:-120% 0}}
.fade{animation:fade .4s cubic-bezier(.2,.8,.3,1) both}
@keyframes fade{from{opacity:0;transform:translateY(8px) scale(.995)}to{opacity:1;transform:none}}
.empty{margin-top:22px;padding:40px 20px;text-align:center;color:var(--dim);font-size:13px;line-height:1.9;
  border:1px dashed var(--hair);border-radius:var(--r-md);background:var(--glass-3)}
::selection{background:rgba(10,132,255,.22)}
.foot{margin-top:26px;text-align:center;color:var(--dim);font-size:11px;line-height:1.9;letter-spacing:.01em;overflow-wrap:anywhere}

@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .qcard,.hero,.card,.sec,details,.wallet-head,.mini,.bar,.btn.ghost,.topbar,.empty{background:#fff}
  @media (prefers-color-scheme: dark){
    .qcard,.hero,.card,.sec,details,.wallet-head,.mini,.bar,.btn.ghost,.topbar,.empty{background:#15161a}
  }
}

@media(max-width:480px){
  .wallet-sum .stat.total b{font-size:12px}
}
@media(max-width:720px){
  .hero{grid-template-columns:1fr;gap:16px}
  .hero .v{font-size:clamp(32px,9.4vw,42px)}
  .split{grid-template-columns:1fr}
  .wallet-head{grid-template-columns:18px minmax(0,1fr);row-gap:12px;padding:14px 16px}
  .wallet-sum{grid-column:1/-1;grid-template-columns:repeat(3,minmax(0,1fr));column-gap:10px;
    padding-top:12px;border-top:1px solid var(--hair)}
  .wallet-sum{column-gap:12px;row-gap:2px}
  /* 窄屏：标签置顶、数值在下，三列等宽，不挤在一起 */
  .wallet-sum .stat{flex-direction:column;align-items:flex-start;gap:3px}
  .wallet-sum .stat em{font-size:8px;letter-spacing:.06em;width:auto;min-width:0;flex:0 0 auto}
  .wallet-sum .stat b,.wallet-sum .stat.total b{font-size:12.5px;letter-spacing:0}
  .topbar{padding:10px 12px;flex-wrap:wrap}
  .status{white-space:normal}
  .row .r{font-size:12.8px}
  .ch{grid-template-columns:1fr;grid-template-areas:"pill" "tot" "parts";row-gap:8px}
  .ch .tot{justify-self:start;text-align:left}
}

.qcard::before,.hero::before,.card::before,.wallet-head::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(180deg,var(--sheen),transparent 38%);

}

  }
  function words(h) {

    dec = dec === undefined ? 9 : dec;
    var p = decStr(raw, dec);
    var keep = p.ip === '0' ? 6 : 2;
    var fp = (p.fp + '0000000000').slice(0, keep);
    if (/^0*$/.test(fp)) fp = '';
    return (p.neg ? '-' : '') + group(p.ip) + (fp ? '.' + fp : '');

    return t.indexOf('.') < 0 ? t + '.00' : (t.split('.')[1].length === 1 ? t + '0' : t);

  }

    var now = Date.now();

    return list.length ? list : CHAINS[chain].rpcs.slice();
  }

    if (dead[chain]) dead[chain][url] = 0;
    var list = ranked[chain] || CHAINS[chain].rpcs.slice();

  /* 首个批次同时打所有端点，取最快的那个（省掉一次测速往返） */
  function race(urls, body, timeout) {

      var done = false, left = urls.length;
      var timer = setTimeout(function () { if (!done) { done = true; resolve(null); } }, timeout + 400);

          if (Array.isArray(j) && j.length) { done = true; clearTimeout(timer); resolve({ url: u, json: j }); }
          else if (--left === 0) { done = true; clearTimeout(timer); resolve(null); }
        }, function () {
          if (--left === 0 && !done) { done = true; clearTimeout(timer); resolve(null); }
        });
      });
    });

  async function rpcCall(chain, method, params) {
    var urls = alive(chain), last;

        last = new Error(j && j.error ? j.error.message : 'empty');

        try {
          var j = await postJSON(urls[i], body, LIMIT.timeout);
          if (Array.isArray(j) && j.length === group.length) { got = j; promote(chain, urls[i]); }
          else markDead(chain, urls[i]);
        } catch (e) { markDead(chain, urls[i]); }
      }
      if (got) {
        got.forEach(function (item) {
          if (!item || typeof item.id !== 'number') return;
          out[item.id] = item.error ? null : item.result;
        });
        return;
      }
      // 批量被拒时逐条重试
      for (var k2 = 0; k2 < group.length; k2++) {
        for (var u = 0; u < urls.length; u++) {
          try {
            var r = await postJSON(urls[u], {
              jsonrpc: '2.0', id: 0, method: 'eth_call',
              params: [{ to: group[k2].to, data: group[k2].data }, 'latest']
            }, LIMIT.timeout);
            if (r && r.result !== undefined) { out[offset + k2] = r.result; break; }
            if (r && r.error) { out[offset + k2] = null; break; }
          } catch (e) { /* 继续 */ }
        }
      }
    }

    var idx = 0;
    async function worker() {
      while (idx < jobs.length) {
        var job = jobs[idx++];
        await run(job[0], job[1]);
      }
    }
    var ws = []; for (var wq = 0; wq < LIMIT.workers; wq++) ws.push(worker());
    await Promise.all(ws);
    return out;
  }

  /* 区块时间（用于剩余天数），每条链缓存 2 分钟；超时直接放弃，不阻塞总数 */
  var btCache = {};
  async function blockInfo(chain) {
    var hit = btCache[chain];
    if (hit && Date.now() - hit.at < 120000) return hit.val;
    var job = (async function () {
      try {
        var head = await rpcCall(chain, 'eth_getBlockByNumber', ['latest', false]);
        var n = Number(hexToBig(head.number));
        var prev = await rpcCall(chain, 'eth_getBlockByNumber', ['0x' + Math.max(1, n - 50000).toString(16), false]);
        var t2 = Number(hexToBig(head.timestamp)), t1 = Number(hexToBig(prev.timestamp));
        var pn = Number(hexToBig(prev.number));
        var val = { cur: n, ts: t2, spb: (t2 - t1) / Math.max(1, n - pn) };
        btCache[chain] = { at: Date.now(), val: val };
        return val;
      } catch (e) {
        btCache[chain] = { at: Date.now(), val: null };
        return null;
      }
    })();
    var guard = new Promise(function (res) { setTimeout(function () { res(null); }, 6000); });
    return Promise.race([job, guard]);
  }
  function matDate(block, bt) {
    if (!bt || block === null || block === undefined) return null;
    var ts = bt.ts + (Number(block) - bt.cur) * bt.spb;
    var d = new Date(ts * 1000);
    var y = d.getUTCFullYear();
    if (y < 2023 || y > 2035) return null;
    return d.toISOString().slice(0, 10);
  }
  function daysLeft(block, bt) {
    if (!bt || block === null || block === undefined) return null;
    return Math.round((Number(block) - bt.cur) * bt.spb / 86400);
  }

  /* Anubis 部分质押合约的 expiry 字段是秒级时间戳而不是区块号，这里做一次判别 */
  function expiryDate(v, bt) {
    if (v === null || v === undefined || v === 0n) return null;
    var n = Number(v);
    if (n > 2000000000) return new Date(n * 1000).toISOString().slice(0, 10);
    return matDate(v, bt);
  }
  function expiryDays(v, bt) {
    if (v === null || v === undefined || v === 0n) return null;
    var n = Number(v);
    if (n > 2000000000) return Math.round((n * 1000 - Date.now()) / 86400000);
    return daysLeft(v, bt);
  }

  /* ========================================================================
     3. 读取：一条链 × 一个钱包
     ====================================================================== */
  async function readChain(chainKey, wallet) {
    var cfg = CHAINS[chainKey], A = addr32(wallet);
    var res = {
      key: chainKey, cfg: cfg,
      lgns: null, flex: null, warmup: null,
      locks: [], pools: [], bonds: [], rewards: [], extras: [], ilo: null,
      errors: [], bt: null
    };

    var calls = [], slot = {};
    function push(tag, to, data) { slot[tag] = calls.length; calls.push({ to: to, data: data }); }

    push('lgns', cfg.lgns, SEL.balanceOf + A);
    push('flex', cfg.slgns, SEL.balanceOf + A);
    push('warmup', cfg.staking, SEL.warmupInfo + A);
    cfg.longLocks.forEach(function (l, i) {
      push('lockCount' + i, l.addr, SEL.stakesCount + A);
      push('lockTotal' + i, l.addr, SEL.depositorBalance + A);
    });
    cfg.pools.forEach(function (o, i) { push('poolTotal' + i, o.addr, SEL.depositorBalance + A); });
    cfg.bonds.forEach(function (b, i) {
      push('bondLen' + i, b.addr, b.abi === 'burn' ? SEL.depositCount + A : SEL.bondLength + A);
    });
    cfg.rewards.forEach(function (r, i) {
      push('reward' + i, r.addr, r.kind === 'turbine' ? SEL.turbineBal + A : SEL.rewardOf + A);
    });
    cfg.extras.forEach(function (x, i) {
      push('xbal' + i, x.addr, SEL.balanceOf + A);
      if (x.dec === null) push('xdec' + i, x.addr, SEL.decimals);
    });
    if (cfg.ilo) {
      push('iloDiscount', cfg.ilo.discount, SEL.depositorBalance + A);
      push('iloCount', cfg.ilo.lgnsIlo, SEL.depositCount + A);
      push('idoDai', cfg.ilo.idoLedger, SEL.idoTotalDai + A);
    }

    var btP = blockInfo(chainKey);
    var base = await callMany(chainKey, calls);
    var bt = await btP;

    function get(tag) {
      var i = slot[tag];
      if (i === undefined) return undefined;
      return base[i];
    }
    function big(tag) { var v = get(tag); return (v === null || v === undefined) ? null : hexToBig(v); }

    var lg = big('lgns');
    res.lgns = lg === null ? null : { raw: lg, dec: 9 };
    var fx = big('flex');
    res.flex = fx === null ? null : { raw: fx, dec: 9 };
    var wm = get('warmup');
    if (wm === null || wm === undefined) res.warmup = null;
    else { var w = words(wm); res.warmup = { raw: w[0] || 0n }; }

    /* ---- 长期质押（计入） ---- */
    for (var i = 0; i < cfg.longLocks.length; i++) {
      var lc = big('lockCount' + i);
      var lt = big('lockTotal' + i);
      if (lt === null && lc === null) continue;               // 合约不可读，忽略
      res.locks.push({
        label: cfg.longLocks[i].label, addr: cfg.longLocks[i].addr,
        count: lc === null ? null : Number(lc),
        present: lt === null ? 0n : lt,
        items: []
      });
    }

    /* ---- 其他 LGNS 计价质押（计入） ---- */
    for (var j = 0; j < cfg.pools.length; j++) {
      var ot = big('poolTotal' + j);
      if (ot === null) { res.errors.push(cfg.pools[j].label + ' 读取失败（接口变更或已下线）'); continue; }
      res.pools.push({
        label: cfg.pools[j].label, addr: cfg.pools[j].addr,
        note: cfg.pools[j].note || '', present: ot
      });
    }

    /* ---- 债券 ---- */
    for (var b = 0; b < cfg.bonds.length; b++) {
      var bl = big('bondLen' + b);
      if (bl === null) continue;
      res.bonds.push({
        label: cfg.bonds[b].label, addr: cfg.bonds[b].addr, sym: cfg.bonds[b].sym,
        dec: cfg.bonds[b].dec, abi: cfg.bonds[b].abi || 'bond',
        count: Number(bl), claimable: 0n, payable: 0n, principal: 0n, deposits: []
      });
    }

    /* ---- 奖励 ---- */
    for (var r = 0; r < cfg.rewards.length; r++) {
      var rv = get('reward' + r);
      if (rv === null || rv === undefined) continue;
      var ws = words(rv);
      var kind = cfg.rewards[r].kind;
      var tot = ws[0] || 0n, clm = ws.length > 1 ? (ws[1] || 0n) : 0n;
      var left = tot > clm ? tot - clm : 0n;
      if (kind === 'turbine') { tot = left; clm = 0n; }   // 涡轮接口直接返回可领余额
      res.rewards.push({
        label: cfg.rewards[r].label, addr: cfg.rewards[r].addr, kind: kind,
        total: tot, claimed: clm, raw: left
      });
    }

    /* ---- 其他资产 ---- */
    for (var x = 0; x < cfg.extras.length; x++) {
      var xb = big('xbal' + x);
      if (xb === null) continue;
      var xd = cfg.extras[x].dec;
      if (xd === null) { var dd = big('xdec' + x); xd = dd === null ? 18 : Number(dd); }
      res.extras.push({ label: cfg.extras[x].label, sym: cfg.extras[x].sym, raw: xb, dec: xd });
    }

    /* ---- ILO（仅 Anubis，单独展示、不计入） ---- */
    if (cfg.ilo) {
      var ic = big('iloCount');
      var idoDai = big('idoDai');
      var idsc = big('iloDiscount');
      res.ilo = {
        count: ic === null ? null : Number(ic),
        lgns: 0n, dai: 0n, records: [],
        idoDai: idoDai || 0n,
        discount: idsc === null ? 0n : idsc,      // 创世 360 现值（LGNS，计入）
        online: idsc !== null,
        ok: ic !== null || idoDai !== null || idsc !== null
      };
    }

    /* ---- 细节：长期质押逐笔 ---- */
    var detail = [];
    cfg.longLocks.forEach(function (l, ii) {
      var r0 = res.locks.filter(function (o) { return o.addr === l.addr; })[0];
      if (!r0 || !r0.count) return;
      var n = Math.min(r0.count, LIMIT.entries);
      for (var k = 0; k < n; k++) {
        detail.push({ kind: 'lock', ref: r0, index: k, to: l.addr, data: SEL.stakes + A + u256(k) });
      }
      if (r0.count > LIMIT.entries) res.errors.push(l.label + ' 超过 ' + LIMIT.entries + ' 笔，明细未取全');
    });
    /* ---- 细节：债券逐笔 ---- */
    cfg.bonds.forEach(function (bd) {
      var rr = res.bonds.filter(function (o) { return o.addr === bd.addr; })[0];
      if (!rr || !rr.count) return;
      var n = Math.min(rr.count, LIMIT.entries);
      if (bd.abi === 'burn') {
        for (var k2 = 0; k2 < n; k2++) {
          detail.push({ kind: 'burn', ref: rr, index: k2, to: bd.addr, data: SEL.deposit + A + u256(k2) });
          detail.push({ kind: 'burnClaim', ref: rr, index: k2, to: bd.addr, data: SEL.claimable + A + u256(k2) });
        }
      } else {
        detail.push({ kind: 'bondList', ref: rr, to: bd.addr, data: SEL.bondData + A });
      }
    });
    /* ---- 细节：ILO 逐笔 ---- */
    if (cfg.ilo && res.ilo && res.ilo.count) {
      detail.push({ kind: 'iloList', to: cfg.ilo.lgnsIlo, data: SEL.iloDeposits + A });
    }

    if (detail.length) {
      var det = await callMany(chainKey, detail);
      for (var d = 0; d < detail.length; d++) {
        var it = detail[d], raw = det[d];
        if (raw === null) continue;
        if (it.kind === 'lock') {
          var w2 = words(raw);
          it.ref.items.push({
            principal: w2[0] || 0n,
            gons: w2[1] || 0n,
            matBlock: w2[3] || 0n,
            startBlock: w2[5] || 0n,
            present: null
          });
        } else if (it.kind === 'burn') {
          var w3 = words(raw);
          /* Anubis 销毁债券 getUserDeposit 结构：
             daiValue, capBps, burnedLgns, releasedDaiValue, claimedLgns, ..., mode
             本金取 burnedLgns(2)；旧版若只有 1 个字段则退化为 w3[0] */
          var prin = w3.length >= 9 ? (w3[2] || 0n) : (w3[0] || 0n);
          it.ref.deposits[it.index] = it.ref.deposits[it.index] || {};
          it.ref.deposits[it.index].principal = prin;
          it.ref.principal += prin;
        } else if (it.kind === 'burnClaim') {
          var v = hexToBig(raw);
          it.ref.deposits[it.index] = it.ref.deposits[it.index] || {};
          it.ref.deposits[it.index].claimable = v;
          it.ref.claimable += v;
        } else if (it.kind === 'bondList') {
          var arr = words(raw);
          if (arr.length >= 2) {
            var off2 = Number(arr[0] / 32n), len = Number(arr[off2] || 0n), p = off2 + 1;
            /* 每条 Bond 的字段数按 ABI 实际长度推导：
               Polygon 6 字段 (owner,id,payout,vesting,lastBlock,pricePaid)
               Anubis  8 字段（额外 gons、fee） */
            var stride = len > 0 ? Math.floor((arr.length - p) / len) : 0;
            if (stride < 6) stride = 6;
            for (var q = 0; q < len && p + stride - 1 < arr.length; q++, p += stride) {
              it.ref.deposits.push({
                id: arr[p + 1], payout: arr[p + 2], vesting: arr[p + 3], lastBlock: arr[p + 4],
                pricePaid: arr[p + 5], gons: stride > 6 ? (arr[p + 6] || 0n) : 0n, value: null
              });
            }
          }
        } else if (it.kind === 'iloList') {
          var wr = words(raw);
          if (wr.length >= 2) {
            var off = Number(wr[0] / 32n), n2 = Number(wr[off] || 0n), p2 = off + 1;
            for (var z = 0; z < n2 && p2 + 8 < wr.length; z++, p2 += 9) {
              var rec = {
                dai: wr[p2] || 0n, lgns: wr[p2 + 1] || 0n, lp: wr[p2 + 2] || 0n,
                ts: wr[p2 + 4] || 0n, epoch: wr[p2 + 5] || 0n,
                reward: wr[p2 + 6] || 0n, claimed: wr[p2 + 7] || 0n, mode: Number(wr[p2 + 8] || 0n)
              };
              res.ilo.records.push(rec);
              res.ilo.lgns += rec.lgns;
              res.ilo.dai += rec.dai;
            }
          }
        }
      }
    }

    /* ---- 现值回填：gons -> LGNS（锁仓逐笔、债券逐笔） ---- */
    var priceJobs = [];
    res.locks.forEach(function (l) {
      l.items.forEach(function (it) {
        if (it.gons > 0n) priceJobs.push({ dp: it, to: cfg.slgns, data: SEL.balanceForGons + u256(it.gons) });
      });
    });
    res.bonds.forEach(function (bb) {
      if (bb.abi === 'burn') return;
      bb.deposits.forEach(function (dp) { if (dp && dp.gons > 0n) priceJobs.push({ dp: dp, to: cfg.slgns, data: SEL.balanceForGons + u256(dp.gons) }); });
    });
    if (priceJobs.length) {
      var vals = await callMany(chainKey, priceJobs.map(function (j) { return { to: j.to, data: j.data }; }));
      priceJobs.forEach(function (j, k) {
        var v = vals[k];
        j.dp.present = (v === null || v === undefined) ? null : hexToBig(v);
        j.dp.value = j.dp.present;
      });
    }

    /* ---- 债券应付：普通债券逐笔 pendingPayoutFor，回退 pendingPayout ---- */
    var payJobs = [], payRefs = [];
    res.bonds.forEach(function (bb) {
      if (bb.abi === 'burn') return;
      bb.deposits.forEach(function (dp) {
        if (!dp || dp.id === undefined) return;
        payJobs.push({ to: bb.addr, data: SEL.pendingPayoutFor + A + u256(dp.id) });
        payRefs.push(dp);
      });
    });
    if (payJobs.length) {
      var outs = await callMany(chainKey, payJobs);
      var retry = [];
      payRefs.forEach(function (dp, i) {
        var v = outs[i];
        if (v === null || v === undefined) { retry.push(dp); return; }
        dp.claimable = hexToBig(v);
      });
      if (retry.length) {
        // 回退：pendingPayout(address,uint256)
        var altJobs = [];
        res.bonds.forEach(function (bb) {
          if (bb.abi === 'burn') return;
          bb.deposits.forEach(function (dp) {
            if (dp && retry.indexOf(dp) >= 0) altJobs.push({ dp: dp, to: bb.addr, data: SEL.pendingPayout + A + u256(dp.id) });
          });
        });
        if (altJobs.length) {
          var altOut = await callMany(chainKey, altJobs.map(function (j) { return { to: j.to, data: j.data }; }));
          altJobs.forEach(function (j, i) {
            var v = altOut[i];
            j.dp.claimable = (v === null || v === undefined) ? 0n : hexToBig(v);
          });
        }
      }
    }

    /* ---- 债券汇总：应付按 gons 现值优先，其次 pendingPayout ---- */
    res.bonds.forEach(function (bb) {
      bb.deposits.forEach(function (dp) {
        if (!dp) return;
        var amt = (dp.present !== null && dp.present !== undefined && dp.present > 0n)
          ? dp.present
          : ((dp.claimable || 0n) > 0n ? dp.claimable : (dp.payout || 0n));
        dp.owed = amt;
        bb.payable += amt;
        if (bb.abi === 'burn' && bb.claimable > 0n) bb.payable = bb.claimable;
      });
      if (bb.abi === 'burn') bb.payable = bb.claimable;
    });

    res.bt = bt;
    return res;
  }

  /* ========================================================================
     4. 汇总口径
     ====================================================================== */
  function lockPresent(c) {
    return c.locks.reduce(function (s, l) { return s + (l.present || 0n); }, 0n);
  }
  function lockAccrued(c) {
    var t = 0n;
    c.locks.forEach(function (l) {
      (l.items || []).forEach(function (it) {
        var v = (it.present === null || it.present === undefined) ? null : it.present;
        if (v === null) return;                 // gons 读不到时不算收益，避免虚增
        var diff = v - (it.principal || 0n);
        if (diff > 0n) t += diff;
      });
    });
    return t;
  }
  function poolPresent(c) { return (c.pools || []).reduce(function (s, o) { return s + (o.present || 0n); }, 0n); }
  // 债券：合约记录的应付 LGNS（销毁债券按 getClaimable）
  function bondPayable(c) { return c.bonds.reduce(function (s, b) { return s + (b.payable || 0n); }, 0n); }
  function rewardSum(c) { return c.rewards.reduce(function (s, r) { return s + (r.raw || 0n); }, 0n); }
  // 持仓：钱包 + sLGNS + 预热质押期 + 长期质押现值 + 其他 LGNS 质押现值
  function iloDiscount(c) { return (c.ilo && c.ilo.discount) ? c.ilo.discount : 0n; }
  function holdings(c) {
    return (c.lgns ? c.lgns.raw : 0n) + (c.flex ? c.flex.raw : 0n) +
           (c.warmup ? c.warmup.raw : 0n) + lockPresent(c) + poolPresent(c) + iloDiscount(c);
  }
  // 总币量 = 持仓（含锁仓收益） + 债券应付 + 其它合约待领
  function chainTotal(c) { return holdings(c) + bondPayable(c) + rewardSum(c); }

  async function queryWallet(address) {
    var chains = await Promise.all([readChain('polygon', address), readChain('anubis', address)]);
    return { address: address, chains: chains };
  }

  /* ========================================================================
     5. 渲染
     ====================================================================== */
  function row(label, value, unit, opts) {
    opts = opts || {};
    var cls = 'row' + (opts.cls ? ' ' + opts.cls : '');
    var zero = opts.zero ? ' zero' : '';
    return '<div class="' + cls + zero + '">' +
      '<div class="l">' + label + (opts.sub ? '<small>' + opts.sub + '</small>' : '') + '</div>' +
      '<div class="r"' + (opts.title ? ' title="' + esc(opts.title) + '"' : '') + '>' + value +
      (unit ? '<em>' + unit + '</em>' : '') + '</div></div>';
  }

  function chainCard(c, wallet) {
    var cfg = c.cfg;
    var hold = holdings(c), gold = bondPayable(c), rw = rewardSum(c);
    var total = hold + gold + rw;

    var h = '<section class="card">';

    /* 头部：构成标签最多 4 个，其余折叠成 +N */
    var chips = ['<i>持仓 ' + fmt(hold, 9) + '</i>'];
    if (gold > 0n) chips.push('<i>债券 ' + fmt(gold, 9) + '</i>');
    c.rewards.filter(function (r) { return r.raw > 0n; })
      .forEach(function (r) { chips.push('<i>' + esc(r.short || r.label) + ' ' + fmt(r.raw, 9) + '</i>'); });
    var chipHtml = chips.slice(0, 4).join('') +
      (chips.length > 4 ? '<i>+' + (chips.length - 4) + '</i>' : '');

    h += '<div class="ch">' +
      '<span class="pill ' + cfg.cls + '">' + cfg.name + '</span>' +
      '<div class="tot"><span>本链总币量</span><b>' + fmt2(total, 9) + '</b></div>' +
      '<span class="parts">' + chipHtml + '</span>' +
      '</div>';

    /* 持仓构成 */
    h += '<div class="sec"><div class="sec-h">持仓构成 <span class="hint">计入</span></div>';
    h += row('钱包内自由持有', fmt(c.lgns ? c.lgns.raw : null, 9), 'LGNS',
      { zero: c.lgns && c.lgns.raw === 0n, sub: '链上 ERC-20 余额' });
    h += row('活期质押 sLGNS', fmt(c.flex ? c.flex.raw : null, 9), 'LGNS',
      { zero: c.flex && c.flex.raw === 0n, sub: '随 rebase 增长，1:1 计 LGNS' });
    h += row('预热质押期', fmt(c.warmup ? c.warmup.raw : null, 9), 'LGNS',
      { sub: '已质押、尚未转为 sLGNS', zero: c.warmup && c.warmup.raw === 0n });
    /* 长期质押与其他质押合并为一行「质押现值」 */
    var stakePresent = lockPresent(c) + poolPresent(c);
    h += row('质押现值', fmt(stakePresent, 9), 'LGNS', {
      cls: 'sum',
      sub: (cfg.key === 'polygon'
        ? '长期质押（gons 折算，已含锁仓收益）+ 能量额度质押 / A Stake'
        : '长期质押（gons 折算，已含锁仓收益）+ 即时 / 债券 / 能量点数')
        + (cfg.ilo ? '（创世 360 见 ILO 组）' : ''),
      title: '长期质押 ' + exact(lockPresent(c), 9) + ' + 其他质押 ' + exact(poolPresent(c), 9) + ' = ' + exact(stakePresent, 9) + ' LGNS'
    });
    h += '</div>';

    /* 长期质押明细 */
    var activeLocks = c.locks.filter(function (l) { return (l.present || 0n) > 0n || l.items.length; });
    if (activeLocks.length) {
      h += '<details><summary>长期质押明细 <span class="m">' + activeLocks.length + ' 项 · ' +
        activeLocks.reduce(function (s, l) { return s + (l.count || 0); }, 0) + ' 笔</span></summary><div class="dbody">';
      activeLocks.forEach(function (l) {
        h += '<div class="lock"><div class="lock-h"><span>' + esc(l.label) + '</span>' +
          '<span class="m" title="' + esc(exact(l.present || 0n, 9)) + ' LGNS">现值 ' + fmt(l.present, 9) +
          ' · ' + (l.count || 0) + ' 笔</span></div>';
        if (l.items.length) {
          var live = [], closed = 0;
          l.items.forEach(function (it, i) {
            if ((it.principal || 0n) === 0n && (it.gons || 0n) === 0n) { closed++; return; }
            live.push({ it: it, i: i });
          });
          live.forEach(function (o) {
            var it = o.it, md = expiryDate(it.matBlock, c.bt), dl = expiryDays(it.matBlock, c.bt);
            var when = md ? (dl !== null && dl < 0
              ? '已于 ' + md + ' 到期'
              : '到期 ' + md + (dl !== null ? ' · 剩 ' + dl + ' 天' : '')) : '';
            var pres = (it.present === null || it.present === undefined) ? null : it.present;
            var gain = pres === null ? null : (pres - (it.principal || 0n));
            h += '<div class="ent"><span>#' + (o.i + 1) + ' 本金 <b>' + fmt(it.principal, 9) + '</b> ' +
              (pres !== null ? '· 现值 <b>' + fmt(pres, 9) + '</b> ' : '') +
              (when ? '<span class="when"> · ' + when + '</span>' : '') + '</span>' +
              '<span class="rr">已计息 <b>' + fmt(gain, 9) + '</b></span></div>';
          });
          if (closed) {
            h += '<div class="ent muted">' +
              '另有 ' + closed + ' 笔历史记录已结清（本金 0），不计入</div>';
          }
        }
        h += '</div>';
      });
      h += '</div></details>';
    }

    /* 其他质押（计入） */
    if (c.pools.length) {
      h += '<details><summary>' + (cfg.key === 'polygon' ? '能量额度 / A Stake（计入）' : '其他质押（计入）') +
        ' <span class="m">' + fmt(poolPresent(c), 9) + '</span></summary><div class="dbody">';
      c.pools.forEach(function (o) {
        h += row(esc(o.label), fmt(o.present, 9), 'LGNS', {
          zero: o.present === 0n,
          sub: o.note || 'getDepositorBalance 现值'
        });
      });
      h += '</div></details>';
    }

    /* ILO（仅 Anubis）：官网 /ilo 页 = 创世 360 + ILO(LGNS) + ILO(DAI) */
    if (cfg.ilo && c.ilo) {
      var ilo = c.ilo;
      var hasAny = (ilo.count || 0) > 0 || ilo.idoDai > 0n || (ilo.discount || 0n) > 0n;
      h += '<details><summary>ILO（Anubis） <span class="m">' +
        (hasAny
          ? ((ilo.discount || 0n) > 0n ? '创世 ' + fmt(ilo.discount, 9) : '无创世仓位') +
            ((ilo.count || 0) > 0 ? ' · ' + ilo.count + ' 笔' : '') + (ilo.idoDai > 0n ? ' · 含 DAI' : '')
          : '无记录') +
        '</span></summary><div class="dbody">';
      h += row('创世 360（Discount Staking）', fmt(ilo.discount, 9), 'LGNS', {
        zero: (ilo.discount || 0n) === 0n,
        sub: 'DAI 折价申购 LGNS，协议储备补贴额外 LGNS · getDepositorBalance 现值'
      });
      h += row('ILO（LGNS 申购）笔数', String(ilo.count || 0), '笔', { zero: !ilo.count });
      h += row('ILO（LGNS 申购）累计 LGNS', fmt(ilo.lgns, 9), 'LGNS', { zero: ilo.lgns === 0n,
        sub: 'ILO 合约 getUserDeposits 记录' });
      h += row('ILO（DAI 申购）累计 DAI', fmt(ilo.idoDai, 18), 'DAI', { zero: ilo.idoDai === 0n,
        sub: 'ILO Ledger contract totalDaiDeposited' });
      (ilo.records || []).slice(-10).reverse().forEach(function (rec, i) {
        var when = rec.ts ? new Date(Number(rec.ts) * 1000).toISOString().slice(0, 10) : '';
        h += '<div class="ent"><span>#' + (i + 1) + ' ' + (when ? when + ' · ' : '') +
          'LGNS <b>' + fmt(rec.lgns, 9) + '</b>' + (rec.dai > 0n ? ' · DAI <b>' + fmt(rec.dai, 18) + '</b>' : '') +
          '</span><span class="rr">奖励 <b>' + fmt(rec.reward, 9) + '</b></span></div>';
      });
      h += '</div></details>';
    }

    /* 债券 */
    if (c.bonds.length) {
      var heldBonds = c.bonds.filter(function (b) { return b.count > 0; });
      h += '<details><summary>债券（计入） <span class="m">' +
        (heldBonds.length ? fmt(gold, 9) + ' LGNS' : c.bonds.length + ' 类 · 无持仓') + '</span></summary><div class="dbody">';
      if (!heldBonds.length) {
        h += '<div class="ent muted"><span>当前无存入</span></div>';
      }
      heldBonds.forEach(function (b) {
        h += '<div class="lock"><div class="lock-h"><span>' + esc(b.label) + '</span>' +
          '<span class="m">' + b.count + ' 笔 · 应付 ' + fmt(b.payable, 9) + ' LGNS</span></div>';
        if (b.principal > 0n) {
          h += '<div class="ent"><span>存入本金 <b>' + (b.abi === 'burn'
            ? fmt(b.principal, 9) + ' LGNS（已销毁）'
            : fmt(b.principal, b.dec) + ' ' + esc(b.sym)) + '</b></span>' +
            '<span class="rr">可领 <b>' + fmt(b.claimable, 9) + '</b> LGNS</span></div>';
        }
        b.deposits.forEach(function (d, i) {
          if (!d) return;
          var owed = (d.owed !== undefined && d.owed !== null) ? d.owed : (d.claimable || 0n);
          h += '<div class="ent sub"><span>#' + (i + 1) +
            ' 存入 ' + (b.abi === 'burn' ? fmt(d.principal, 9) + ' LGNS' : fmt(d.payout, 9) + ' LGNS') +
            '</span><span class="rr">应付 <b>' + fmt(owed, 9) + '</b></span></div>';
        });
        h += '</div>';
      });
      h += '</div></details>';
    }

    /* 其它合约待领（计入） */
    if (c.rewards.length) {
      h += '<details><summary>' + (cfg.key === 'polygon' ? '涡轮 / 蜘蛛网 / 社区奖励（计入）' : '涡轮 / 蜘蛛网 / DAO 奖励（计入）') +
        ' <span class="m">' + fmt(rw, 9) + '</span></summary><div class="dbody">';
      c.rewards.forEach(function (r) {
        h += row(esc(r.label), fmt(r.raw, 9), 'LGNS', {
          zero: r.raw === 0n,
          sub: r.kind === 'turbine'
            ? '涡轮合约内可领余额'
            : '累计 ' + fmt(r.total, 9) + ' · 已领 ' + fmt(r.claimed, 9),
          title: r.kind === 'turbine'
            ? 'getTurbineBal 返回的可领余额'
            : '未领取 = 累计 ' + exact(r.total, 9) + ' − 已领 ' + exact(r.claimed, 9)
        });
      });
      h += '</div></details>';
    }

    /* 长期质押已计息：仅参考 */
    if (lockAccrued(c) > 0n) {
      h += '<details><summary>长期质押已计息（仅参考，不叠加） <span class="m">' + fmt(lockAccrued(c), 9) + '</span></summary><div class="dbody">';
      h += row('逐笔现值 − 本金 合计', fmt(lockAccrued(c), 9), 'LGNS',
        { sub: '已折算进上方「长期质押现值」，再相加会重复' });
      h += '</div></details>';
    }

    /* 其他资产 */
    var nz = c.extras.filter(function (x) { return x.raw > 0n; });
    h += '<details><summary>钱包其他资产 <span class="m">' +
      (nz.length ? nz.length + ' 项有余额' : '无') + '</span></summary><div class="dbody">';
    (nz.length ? nz : c.extras).forEach(function (x) {
      h += row(esc(x.label), fmt(x.raw, x.dec), esc(x.sym), { zero: x.raw === 0n });
    });
    h += '</div></details>';

    if (c.errors.length) h += '<div class="errbox">' + esc(c.errors.join('；')) + '</div>';
    h += '</section>';
    return h;
  }

  function walletBlock(w, idx, total2) {
    var p = w.chains[0], a = w.chains[1];
    var tp = chainTotal(p), ta = chainTotal(a);
    var open = (total2 <= 1);
    var h = '<div class="wallet' + (open ? ' open' : '') + '" id="w' + ((idx || 0) + 1) + '">';
    h += '<div class="wallet-head" role="button" tabindex="0" aria-expanded="' + (open ? 'true' : 'false') + '">' +
      '<span class="chev" aria-hidden="true"></span>' +
      '<span class="wleft">' +
      ((total2 > 1) ? '<span class="idx">#' + ((idx || 0) + 1) + '</span>' : '') +
      '<span class="waddr" title="' + esc(w.address) + '">' + esc(short(w.address)) + '</span>' +
      '</span>' +
      '<span class="wallet-sum">' +
        '<span class="stat"><em>Polygon</em><b>' + fmt(tp, 9) + '</b></span>' +
        '<span class="stat"><em>Anubis</em><b>' + fmt(ta, 9) + '</b></span>' +
        '<span class="stat total"><em>TOTAL</em><b>' + fmt2(tp + ta, 9) + '</b></span>' +
      '</span></div>';
    h += '<div class="wbody"><div class="grid">' + chainCard(p, w.address) + chainCard(a, w.address) + '</div></div>';
    h += '</div>';
    return h;
  }

  function render(wallets) {
    var P = 0n, A = 0n, goldP = 0n, goldA = 0n, rwAll = 0n, free = 0n, flex = 0n, warm = 0n, lock = 0n, pool = 0n, discAll = 0n;
    wallets.forEach(function (w) {
      var p = w.chains[0], a = w.chains[1];
      P += holdings(p); A += holdings(a);
      pool += poolPresent(p) + poolPresent(a);
      discAll += iloDiscount(p) + iloDiscount(a);
      goldP += bondPayable(p); goldA += bondPayable(a);
      rwAll += rewardSum(p) + rewardSum(a);
      free += (p.lgns ? p.lgns.raw : 0n) + (a.lgns ? a.lgns.raw : 0n);
      flex += (p.flex ? p.flex.raw : 0n) + (a.flex ? a.flex.raw : 0n);
      warm += (p.warmup ? p.warmup.raw : 0n) + (a.warmup ? a.warmup.raw : 0n);
      lock += lockPresent(p) + lockPresent(a);
    });
    var hold = P + A, gold = goldP + goldA, total = hold + gold + rwAll;
    var chainP = walletChainTotal(wallets, 0), chainA = walletChainTotal(wallets, 1);

    var h = '';
    h += '<div class="hero">' +
      '<div><div class="k">总币量 <i>持仓 + 债券 + 奖励</i>' +
      (wallets.length > 1 ? '<i class="n">' + wallets.length + ' 个钱包</i>' : '') + '</div>' +
      '<div class="v" title="' + esc(exact(total, 9)) + '">' + fmt2(total, 9) + '<small>LGNS</small></div>' +
      '<div class="eq">钱包 ' + fmt(free, 9) + ' + 活期 ' + fmt(flex, 9) + ' + 预热质押期 ' + fmt(warm, 9) +
      ' + 质押现值 ' + fmt(lock + pool, 9) +
      (discAll > 0n ? ' + 创世360 ' + fmt(discAll, 9) : '') + (gold > 0n ? ' + 债券 ' + fmt(gold, 9) : '') +
      (rwAll > 0n ? ' + 奖励待领 ' + fmt(rwAll, 9) : '') + '</div></div>' +
      '<div class="hero-side">' +
      '<div class="mini"><span>其中持仓</span><b>' + fmt(hold, 9) + '</b></div>' +
      '<div class="mini mute"><span>债券 / 奖励待领</span><b>' + fmt(gold + rwAll, 9) + '</b></div>' +
      '</div>' +
      '<div class="split">' +
      '<div class="bar"><div class="t"><span>Polygon</span><b>' + fmt(chainP, 9) + '</b></div><div class="track"><div class="fill" style="width:' + pct(chainP, total) + '%"></div></div></div>' +
      '<div class="bar"><div class="t"><span>Anubis</span><b>' + fmt(chainA, 9) + '</b></div><div class="track"><div class="fill" style="width:' + pct(chainA, total) + '%"></div></div></div>' +
      '</div></div>';

    wallets.forEach(function (w, i) { h += walletBlock(w, i, wallets.length); });
    return h;
  }
  function walletChainTotal(wallets, idx) {
    var t = 0n;
    wallets.forEach(function (w) { t += chainTotal(w.chains[idx]); });
    return t;
  }
  function pct(a, b) {
    if (!b) return 0;
    var v = Number(a * 10000n / b) / 100;
    return Math.max(0, Math.min(100, v));
  }

  /* ========================================================================
     6. 交互
     ====================================================================== */
  var $ = function (id) { return document.getElementById(id); };
  var state = { busy: false, last: null };
  var WKEY = 'lgns_holdings_wallets_v3';

  function parseAddrs(text) {
    var raw = String(text || '').split(/[\s,;，；、]+/).filter(Boolean);
    var valid = [], invalid = [], seen = {};
    raw.forEach(function (a) {
      if (!isAddr(a)) { invalid.push(a); return; }
      var k = a.toLowerCase();
      if (seen[k]) return;
      seen[k] = 1; valid.push(a);
    });
    return { valid: valid, invalid: invalid };
  }
  function skeleton() {
    var one = '<div class="sk-card"><div class="sk-line sk-big"></div><div class="sk-line w90"></div>' +
      '<div class="sk-line w70"></div><div class="sk-line w50"></div></div>';
    var two = '<div class="sk-card"><div class="sk-line w30"></div><div class="sk-line w90"></div>' +
      '<div class="sk-line w70"></div><div class="sk-line w50"></div><div class="sk-line w90"></div></div>';
    return '<div class="skel">' + one + '<div class="grid">' + two + two + '</div></div>';
  }
  function setStatus(html, cls) {
    var el = $('status');
    el.className = 'status' + (cls ? ' ' + cls : '');
    el.innerHTML = html;
  }
  function loadSaved() {
    try { return JSON.parse(localStorage.getItem(WKEY) || '[]').filter(isAddr); } catch (e) { return []; }
  }
  function saveSaved(list) {
    try { localStorage.setItem(WKEY, JSON.stringify(list)); } catch (e) {}
  }

  async function run() {
    if (state.busy) return;
    var p = parseAddrs($('addr').value);
    if (p.invalid.length) {
      setStatus('地址格式不对：' + esc(p.invalid.slice(0, 3).join(', ')) + '（需 0x 开头 42 位）', 'err');
      return;
    }
    if (!p.valid.length) { setStatus('请先输入至少一个钱包地址', 'err'); return; }
    if (p.valid.length > LIMIT.wallets) {
      setStatus('一次最多 ' + LIMIT.wallets + ' 个钱包', 'err');
      return;
    }

    state.busy = true;
    $('go').disabled = true;
    $('go').textContent = '查询中…';
    $('empty').style.display = 'none';
    $('out').innerHTML = skeleton();
    saveSaved(p.valid);
    setStatus('<span class="spin"></span>正在读取 ' + p.valid.length + ' 个钱包的双链数据…', 'live');

    try {
      var done = 0, results = new Array(p.valid.length);
      var next = 0;
      async function worker() {
        while (next < p.valid.length) {
          var i = next++;
          results[i] = await queryWallet(p.valid[i]);
          done++;
          setStatus('<span class="spin"></span>已完成 ' + done + ' / ' + p.valid.length + ' 个钱包…', 'live');
        }
      }
      await Promise.all([worker(), worker()]);

      state.last = results;
      $('out').innerHTML = render(results);
      $('out').firstChild && $('out').firstChild.classList.add('fade');

      var errs = 0;
      results.forEach(function (w) {
        w.chains.forEach(function (c) { errs += c.errors.length; });
      });
      setStatus('✓ 查询完成 · ' + new Date().toLocaleString('zh-CN') +
        (errs ? ' · ' + errs + ' 项提示' : ''), 'live');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
      setStatus('查询失败：' + esc(e && e.message ? e.message : '网络异常') + '。可稍后重试。', 'err');
    } finally {
      state.busy = false;
      $('go').disabled = false;
      $('go').textContent = '查询持仓';
    }
  }


  function init() {
    $('go').addEventListener('click', run);
    $('clear').addEventListener('click', function () {
      $('addr').value = '';
      $('out').innerHTML = '';
      $('empty').style.display = '';
      state.last = null;
      try { localStorage.removeItem(WKEY); } catch (e) {}   // 同时清掉本机记住的钱包
      setStatus('已清空输入与本机记住的钱包');
      $('addr').focus();
    });
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      var hd = e.target && e.target.closest ? e.target.closest('.wallet-head') : null;
      if (!hd) return;
      e.preventDefault();
      var w = hd.parentNode, on = w.classList.toggle('open');
      hd.setAttribute('aria-expanded', on ? 'true' : 'false');
    });
    $('addr').addEventListener('keydown', function (e) {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); run(); }
    });
    document.addEventListener('click', function (e) {
      var t = e.target;
      var head = t && t.closest ? t.closest('.wallet-head') : null;
      if (head) {
        var box2 = head.parentNode;
        var isOpen = box2.classList.toggle('open');
        head.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
        return;
      }
    });
    var saved = loadSaved();
    if (saved.length) $('addr').value = saved.join('\n');
    try {
      var q = new URLSearchParams(location.search).get('addr');
      if (q) { $('addr').value = q; run(); }
    } catch (e) {}
  }

  if (typeof document !== 'undefined' && document.getElementById('addr')) init();
  if (typeof window !== 'undefined') {
    window.__WQ = { queryWallet: queryWallet, holdings: holdings, bondPayable: bondPayable, rewardSum: rewardSum, chainTotal: chainTotal, poolPresent: poolPresent, lockPresent: lockPresent, fmt: fmt, CHAINS: CHAINS, render: render };
  }
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = { queryWallet: queryWallet, holdings: holdings, bondPayable: bondPayable, rewardSum: rewardSum, chainTotal: chainTotal, lockPresent: lockPresent, lockAccrued: lockAccrued, poolPresent: poolPresent, fmt: fmt, CHAINS: CHAINS, render: render };
  }
})();
</script>
</body>
</html>
